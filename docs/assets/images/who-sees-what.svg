  <rect x="252" y="394" width="146" height="42" rx="5" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/>
  <text x="325" y="420" text-anchor="middle" font-size="13" fill="#59636e">—</text>
  <rect x="402" y="394" width="146" height="42" rx="5" fill="#dafbe1" stroke="#116329" stroke-width="1"/>
  <text x="475" y="420" text-anchor="middle" font-size="13" fill="#116329">their own</text>
  <rect x="552" y="394" width="146" height="42" rx="5" fill="#dafbe1" stroke="#116329" stroke-width="1"/>
  <text x="625" y="420" text-anchor="middle" font-size="13" fill="#116329">their own</text>
  <rect x="702" y="394" width="146" height="42" rx="5" fill="#dafbe1" stroke="#116329" stroke-width="1"/>
  <text x="775" y="420" text-anchor="middle" font-size="13" fill="#116329">any comment</text>
  <rect x="20" y="454" width="26" height="20" rx="4" fill="#dafbe1" stroke="#116329" stroke-width="1"/>
  <text x="54" y="469" font-size="13" fill="#1a1a1a">can use it (✓, or which ones)</text>
  <rect x="292.8" y="454" width="26" height="20" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1"/>
  <text x="326.8" y="469" font-size="13" fill="#1a1a1a">sent to another page</text>
  <rect x="500.8" y="454" width="26" height="20" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/>
  <text x="534.8" y="469" font-size="13" fill="#1a1a1a">can't use it</text>
  <text x="20" y="502" font-size="13" fill="#1a1a1a">"Not available" is a message on the page. The API makes the same decisions for itself, whatever the page shows.</text>
</svg>
