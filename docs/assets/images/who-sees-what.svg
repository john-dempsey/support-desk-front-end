  <rect x="402" y="210" width="146" height="42" rx="5" fill="#dafbe1" stroke="#116329" stroke-width="1"/>
  <text x="475" y="236" text-anchor="middle" font-size="13" fill="#116329">their own</text>
  <rect x="552" y="210" width="146" height="42" rx="5" fill="#dafbe1" stroke="#116329" stroke-width="1"/>
  <text x="625" y="236" text-anchor="middle" font-size="13" fill="#116329">theirs + unassigned</text>
  <rect x="702" y="210" width="146" height="42" rx="5" fill="#dafbe1" stroke="#116329" stroke-width="1"/>
  <text x="775" y="236" text-anchor="middle" font-size="13" fill="#116329">every ticket</text>
  <text x="20" y="274" font-size="14" font-weight="700" fill="#1a1a1a">New ticket</text>
