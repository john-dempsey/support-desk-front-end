  <text x="475" y="374" text-anchor="middle" font-size="13" fill="#59636e">Not available</text>
  <rect x="552" y="348" width="146" height="42" rx="5" fill="#dafbe1" stroke="#116329" stroke-width="1"/>
  <text x="625" y="374" text-anchor="middle" font-size="17" fill="#116329">✓</text>
