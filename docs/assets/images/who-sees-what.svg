  <text x="775" y="144" text-anchor="middle" font-size="13" fill="#0550ae" font-family="ui-monospace, Consolas, monospace">→ /tickets</text>
  <text x="20" y="182" font-size="14" font-weight="700" fill="#1a1a1a">The ticket list</text>
