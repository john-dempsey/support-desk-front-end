  <text x="475" y="282" text-anchor="middle" font-size="17" fill="#116329">✓</text>
  <rect x="552" y="256" width="146" height="42" rx="5" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/>
  <text x="625" y="282" text-anchor="middle" font-size="13" fill="#59636e">Not available</text>
  <rect x="702" y="256" width="146" height="42" rx="5" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/>
  <text x="775" y="282" text-anchor="middle" font-size="13" fill="#59636e">Not available</text>
  <text x="20" y="320" font-size="14" font-weight="700" fill="#1a1a1a">Edit or delete a ticket</text>
  <text x="20" y="337" font-size="12" fill="#59636e" font-family="ui-monospace, Consolas, monospace">/tickets/:ticketId/edit</text>
  <rect x="252" y="302" width="146" height="42" rx="5" fill="#ddf4ff" stroke="#0550ae" stroke-width="1"/>
  <text x="325" y="328" text-anchor="middle" font-size="13" fill="#0550ae" font-family="ui-monospace, Consolas, monospace">→ /login</text>
  <rect x="402" y="302" width="146" height="42" rx="5" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/>
  <text x="475" y="328" text-anchor="middle" font-size="13" fill="#59636e">Not available</text>
  <rect x="552" y="302" width="146" height="42" rx="5" fill="#dafbe1" stroke="#116329" stroke-width="1"/>
  <text x="625" y="328" text-anchor="middle" font-size="17" fill="#116329">✓</text>
  <rect x="702" y="302" width="146" height="42" rx="5" fill="#dafbe1" stroke="#116329" stroke-width="1"/>
  <text x="775" y="328" text-anchor="middle" font-size="17" fill="#116329">✓</text>
  <text x="20" y="366" font-size="14" font-weight="700" fill="#1a1a1a">Tags</text>
  <text x="20" y="383" font-size="12" fill="#59636e" font-family="ui-monospace, Consolas, monospace">/tags</text>
