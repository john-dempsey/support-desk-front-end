<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">What ProtectedRoute decides</title>
  <desc id="desc">ProtectedRoute wraps a page, for example ProtectedRoute with allowedRoles agent and admin around TagsPage. First question: is anyone logged in, is user set? If not, it renders Navigate to /login with replace, and the login page shows. If someone is logged in, the second question: was allowedRoles given? If not, any logged-in user may see the page, and it returns children, the page. If allowedRoles was given, the third question: does hasRole(...allowedRoles) say yes? If yes, it returns children, the page. If no, it shows Not available, Your account can't use this page, and a link to the tickets. The page itself never renders, so it sends no requests.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="820" height="470" fill="#ffffff"/>
  <rect x="230" y="16" width="400" height="58" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="244" y="38" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">&lt;ProtectedRoute allowedRoles={...}></tspan></text>
  <text x="244" y="58" font-size="13" fill="#3d444d">around a page, in App.jsx</text>
  <path d="M 430 105 L 555 144 L 430 183 L 305 144 Z" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="430" y="141" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">Anyone logged in?</text>
  <text x="430" y="159" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan font-family="ui-monospace, Consolas, monospace">user</tspan> is set</text>
  <path d="M 430 74 V 103" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 430 235 L 555 274 L 430 313 L 305 274 Z" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="430" y="271" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">allowedRoles given?</text>
  <text x="430" y="289" font-size="12" fill="#1a1a1a" text-anchor="middle">some roles only</text>
  <path d="M 430 183 V 233" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="438" y="212" font-size="13" fill="#1a1a1a" font-weight="700">Yes</text>
  <path d="M 430 365 L 555 404 L 430 443 L 305 404 Z" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="430" y="401" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">One of those roles?</text>
  <text x="430" y="419" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan font-family="ui-monospace, Consolas, monospace">hasRole(...allowedRoles)</tspan></text>
  <path d="M 430 313 V 363" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="438" y="342" font-size="13" fill="#1a1a1a" font-weight="700">Yes</text>
  <rect x="16" y="104" width="250" height="82" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="30" y="126" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">&lt;Navigate to=&quot;/login&quot;</tspan></text>
  <text x="30" y="146" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">  replace /></tspan></text>
  <text x="30" y="166" font-size="13" fill="#3d444d">the login page shows</text>
  <path d="M 305 144 H 268" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="287" y="136" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">No</text>
  <rect x="600" y="240" width="204" height="66" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="614" y="262" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">children</tspan>: the page</text>
  <text x="614" y="282" font-size="13" fill="#3d444d">anyone logged in</text>
  <path d="M 555 274 H 598" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="578" y="266" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">No</text>
  <rect x="600" y="370" width="204" height="66" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="614" y="392" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">children</tspan>: the page</text>
  <text x="614" y="412" font-size="13" fill="#3d444d">one of the right roles</text>
  <path d="M 555 404 H 598" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="578" y="396" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">Yes</text>
  <rect x="16" y="361" width="250" height="86" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="30" y="383" font-size="14" fill="#1a1a1a" font-weight="700">&quot;Not available&quot;</text>
  <text x="30" y="403" font-size="13" fill="#3d444d">Your account can't use this</text>
  <text x="30" y="423" font-size="13" fill="#3d444d">page. (The page never loads.)</text>
  <path d="M 305 404 H 268" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="287" y="396" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">No</text>
</svg>
