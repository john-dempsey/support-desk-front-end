<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two ways to test with a logged-in user</title>
  <desc id="desc">Two kinds of test, side by side. Solid borders are real code; dashed borders are fakes. On the left, a page test, such as TicketDetailPage.test.jsx. renderWithProviders provides the two outer layers: a fake auth value from createFakeAuth(user), which sets who is logged in, with login, register and logout as vi.fn() fakes; inside it a MemoryRouter; and inside that the real page and its components. The API modules the page calls are faked with vi.mock(). On the right, AuthProvider's own test. The real AuthProvider wraps ShowAuth, a tiny component made for the test, which shows what useAuth() gives. Only auth.api.js is faked with vi.mock(). The real localStorage holds the token, and setup.js clears it after every test.</desc>
  <rect width="820" height="470" fill="#ffffff"/>
  <text x="20" y="34" font-size="16" fill="#1a1a1a" font-weight="700">A page test</text>
  <text x="20" y="54" font-size="13" fill="#3d444d">e.g. <tspan font-family="ui-monospace, Consolas, monospace">TicketDetailPage.test.jsx</tspan></text>
  <rect x="20" y="70" width="370" height="270" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="92" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">createFakeAuth(user)</tspan>: a fake auth value</text>
  <text x="34" y="111" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">user: customerUser</tspan>, or anyone</text>
  <text x="34" y="130" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">login</tspan>, <tspan font-family="ui-monospace, Consolas, monospace">logout</tspan>… are <tspan font-family="ui-monospace, Consolas, monospace">vi.fn()</tspan></text>
  <rect x="40" y="150" width="330" height="170" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="54" y="172" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">MemoryRouter</tspan></text>
  <text x="54" y="191" font-size="13" fill="#3d444d">starts at <tspan font-family="ui-monospace, Consolas, monospace">route</tspan>, e.g. <tspan font-family="ui-monospace, Consolas, monospace">/tickets/1</tspan></text>
  <rect x="60" y="214" width="290" height="86" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="74" y="236" font-size="14" fill="#1a1a1a" font-weight="700">The real page</text>
  <text x="74" y="255" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">TicketDetailPage</tspan> and its</text>
  <text x="74" y="274" font-size="13" fill="#3d444d">components, e.g. CommentList</text>
  <rect x="20" y="360" width="370" height="62" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="382" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">tickets.api.js</tspan>, <tspan font-family="ui-monospace, Consolas, monospace">comments.api.js</tspan></text>
  <text x="34" y="401" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">vi.mock(...)</tspan>: answers what the test says</text>
  <text x="20" y="446" font-size="13" fill="#3d444d">The two blue boxes come from <tspan font-family="ui-monospace, Consolas, monospace">renderWithProviders()</tspan></text>
  <text x="430" y="34" font-size="16" fill="#1a1a1a" font-weight="700">AuthProvider's own test</text>
  <text x="430" y="54" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">AuthProvider.test.jsx</tspan></text>
  <rect x="430" y="70" width="370" height="150" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="444" y="92" font-size="14" fill="#1a1a1a" font-weight="700">The real AuthProvider</text>
  <text x="444" y="111" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">user</tspan> state, <tspan font-family="ui-monospace, Consolas, monospace">login()</tspan>, <tspan font-family="ui-monospace, Consolas, monospace">logout()</tspan>, the effects</text>
  <rect x="450" y="136" width="330" height="66" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="464" y="158" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">ShowAuth</tspan>: made for the test</text>
  <text x="464" y="177" font-size="13" fill="#3d444d">shows what <tspan font-family="ui-monospace, Consolas, monospace">useAuth()</tspan> gives</text>
  <rect x="430" y="240" width="370" height="62" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="444" y="262" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">auth.api.js</tspan></text>
  <text x="444" y="281" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">vi.mock(...)</tspan>: no real login, no real API</text>
  <rect x="430" y="322" width="370" height="62" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="444" y="344" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">localStorage</tspan>: real</text>
  <text x="444" y="363" font-size="13" fill="#3d444d">cleared after every test by <tspan font-family="ui-monospace, Consolas, monospace">setup.js</tspan></text>
  <rect x="430" y="410" width="26" height="18" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="464" y="424" font-size="13" fill="#1a1a1a">real code</text>
  <rect x="560" y="410" width="26" height="18" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="594" y="424" font-size="13" fill="#1a1a1a">a fake the test controls</text>
</svg>
