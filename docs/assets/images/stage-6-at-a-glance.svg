<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Stage 6 at a glance</title>
  <desc id="desc">Three aims, each with its topics. Easier to change: topics 02 and 03, one useFetch hook instead of the same effect in five pages. Harder to break: topic 04, an error boundary; topic 05, an accessibility pass; topic 06, a coverage report and the tests it shows are missing. Ready to run outside Vite: topic 07, the production build; topic 08, serving it with nginx, which is optional; topic 09, pinning CORS, which is discussion only. Underneath all three: Stage 5's 161 tests check every change, and there are 199 by the end.</desc>
  <rect width="820" height="400" fill="#ffffff"/>

  <rect x="20" y="20" width="250" height="280" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="145" y="52" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Easier to change</text>
  <rect x="38" y="72" width="214" height="78" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="52" y="98" font-size="14" font-weight="700" fill="#1a1a1a">02–03 One hook</text>
  <text x="52" y="120" font-size="13" fill="#3d444d">useFetch, instead of the</text>
  <text x="52" y="138" font-size="13" fill="#3d444d">same effect in five pages</text>

  <rect x="285" y="20" width="250" height="280" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="410" y="52" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Harder to break</text>
  <rect x="303" y="72" width="214" height="62" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="317" y="98" font-size="14" font-weight="700" fill="#1a1a1a">04 An error boundary</text>
  <text x="317" y="120" font-size="13" fill="#3d444d">a crash isn't a blank page</text>
  <rect x="303" y="144" width="214" height="62" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="317" y="170" font-size="14" font-weight="700" fill="#1a1a1a">05 Accessibility</text>
  <text x="317" y="192" font-size="13" fill="#3d444d">titles, skip link, caption</text>
  <rect x="303" y="216" width="214" height="62" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="317" y="242" font-size="14" font-weight="700" fill="#1a1a1a">06 Coverage</text>
  <text x="317" y="264" font-size="13" fill="#3d444d">find the untested code</text>

  <rect x="550" y="20" width="250" height="280" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="675" y="52" font-size="15.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ready to run outside Vite</text>
  <rect x="568" y="72" width="214" height="62" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="582" y="98" font-size="14" font-weight="700" fill="#1a1a1a">07 The production build</text>
  <text x="582" y="120" font-size="13" fill="#3d444d">what npm run build makes</text>
  <rect x="568" y="144" width="214" height="62" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="582" y="170" font-size="14" font-weight="700" fill="#1a1a1a">08 nginx in Docker</text>
  <text x="582" y="192" font-size="13" fill="#3d444d">optional</text>
  <rect x="568" y="216" width="214" height="62" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="582" y="242" font-size="14" font-weight="700" fill="#1a1a1a">09 Pinning CORS</text>
  <text x="582" y="264" font-size="13" fill="#3d444d">discussion only</text>

  <rect x="20" y="320" width="780" height="60" rx="8" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="410" y="346" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Underneath all three: the tests</text>
  <text x="410" y="368" font-size="13" fill="#3d444d" text-anchor="middle">Stage 5's 161 tests check every change, and still pass unchanged. There are 199 by the end.</text>
</svg>
