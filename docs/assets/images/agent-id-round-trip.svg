<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 300" width="810" height="300" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">An agent's id, there and back</title>
  <desc id="desc">Two rows show the assigned agent's round trip through the edit page, in four steps: from the API, in the form's state, what the dropdown shows, and what's sent with PATCH. Assigned: the API sends assignedAgent as an object with id 3; String() turns that into the string '3' in state; the dropdown shows Alex Agent; Number() turns it back into the number 3, sent as assignedAgentId: 3. Unassigned: the API sends assignedAgent as null; that becomes the empty string in state; the dropdown shows Unassigned; it's sent as assignedAgentId: null. The id 3 is an example.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="810" height="300" fill="#ffffff"/>
  <text x="100.0" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#59636e">from the API</text>
  <text x="320.0" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#59636e">in state</text>
  <text x="495.0" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#59636e">the dropdown</text>
  <text x="715.0" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#59636e">sent with PATCH</text>
  <rect x="20" y="50" width="160" height="70" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="2"/>
  <text x="100.0" y="80" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">assignedAgent:</text>
  <text x="100.0" y="102" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">{ id: 3, … }</text>
  <rect x="270" y="50" width="100" height="70" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="320.0" y="91" text-anchor="middle" font-size="15" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">'3'</text>
  <rect x="430" y="50" width="130" height="70" rx="8" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="495.0" y="91" text-anchor="middle" font-size="15" fill="#1a1a1a" >Alex Agent</text>
  <rect x="640" y="50" width="150" height="70" rx="8" fill="#fff8c5" stroke="#7d4e00" stroke-width="2"/>
  <text x="715.0" y="80" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">assignedAgentId:</text>
  <text x="715.0" y="102" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">3</text>
  <line x1="184" y1="85" x2="266" y2="85" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225.0" y="75" text-anchor="middle" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">String()</text>
  <line x1="374" y1="85" x2="426" y2="85" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="564" y1="85" x2="636" y2="85" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600.0" y="75" text-anchor="middle" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">Number()</text>
  <rect x="20" y="160" width="160" height="70" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="2"/>
  <text x="100.0" y="190" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">assignedAgent:</text>
  <text x="100.0" y="212" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">null</text>
  <rect x="270" y="160" width="100" height="70" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="320.0" y="201" text-anchor="middle" font-size="15" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">''</text>
  <rect x="430" y="160" width="130" height="70" rx="8" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="495.0" y="201" text-anchor="middle" font-size="15" fill="#1a1a1a" >Unassigned</text>
  <rect x="640" y="160" width="150" height="70" rx="8" fill="#fff8c5" stroke="#7d4e00" stroke-width="2"/>
  <text x="715.0" y="190" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">assignedAgentId:</text>
  <text x="715.0" y="212" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">null</text>
  <line x1="184" y1="195" x2="266" y2="195" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225.0" y="185" text-anchor="middle" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">''</text>
  <line x1="374" y1="195" x2="426" y2="195" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="564" y1="195" x2="636" y2="195" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600.0" y="185" text-anchor="middle" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">null</text>
  <text x="225" y="262" text-anchor="middle" font-size="13" fill="#59636e">EditTicketPage.jsx</text>
  <text x="495" y="262" text-anchor="middle" font-size="13" fill="#59636e">the user can change it here</text>
  <text x="715" y="262" text-anchor="middle" font-size="13" fill="#59636e">TicketForm.jsx</text>
  <text x="20" y="288" font-size="12" fill="#59636e">The id 3 is an example: your agent's id may be different.</text>
</svg>
