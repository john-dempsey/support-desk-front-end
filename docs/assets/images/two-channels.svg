<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 556" width="820" height="556" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two channels</title>
  <desc id="desc">The browser at the top and the API at the bottom, which saves each notification as a row in the Notification table. On the left, channel 1, history over REST: the browser asks GET /notifications when the page opens or the user logs in, and the API answers with every saved row, including anything that happened while the user was away. On the right, channel 2, live over Socket.IO: a socket stays open while the user is logged in, and the API pushes notification.created, without being asked, the moment a row is saved, to that user only. Two warnings: a push is lost if the user isn't connected, since nothing is replayed later; and an SLA breach is never pushed, because the worker process that finds it has no socket. So REST is the truth, and the socket is a nudge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="820" height="556" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#1a1a1a">1. History over REST</text>
  <text x="440" y="30" font-size="16" font-weight="700" fill="#1a1a1a">2. Live over Socket.IO</text>
  <rect x="20" y="46" width="780" height="70" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="72" font-size="15" font-weight="700" fill="#1a1a1a">The browser: the React app</text>
  <text x="34" y="96" font-size="13" fill="#3d444d">the notifications page, and the unread count in the navigation bar</text>
  <line x1="60" y1="118" x2="60" y2="294" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="72" y="166" font-size="14" font-weight="700" fill="#1a1a1a">asks</text>
  <text x="72" y="186" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">GET /notifications</text>
  <text x="72" y="206" font-size="12" fill="#3d444d">when the page opens,</text>
  <text x="72" y="222" font-size="12" fill="#3d444d">or the user logs in</text>
  <line x1="250" y1="296" x2="250" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="262" y="166" font-size="14" font-weight="700" fill="#1a1a1a">answers</text>
  <text x="262" y="186" font-size="13" fill="#1a1a1a">every saved row,</text>
  <text x="262" y="206" font-size="12" fill="#3d444d">including what happened</text>
  <text x="262" y="222" font-size="12" fill="#3d444d">while the user was away</text>
  <rect x="470" y="116" width="56" height="180" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <line x1="498" y1="294" x2="498" y2="122" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="146" font-size="12" fill="#3d444d">a socket, open while the user</text>
  <text x="540" y="162" font-size="12" fill="#3d444d">is logged in</text>
  <text x="540" y="200" font-size="14" font-weight="700" fill="#1a1a1a">pushes, without being asked</text>
  <text x="540" y="220" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">notification.created</text>
  <text x="540" y="240" font-size="12" fill="#3d444d">the moment a row is saved,</text>
  <text x="540" y="256" font-size="12" fill="#3d444d">to that user only</text>
  <rect x="20" y="296" width="780" height="110" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="34" y="324" font-size="15" font-weight="700" fill="#1a1a1a">The API</text>
  <text x="34" y="346" font-size="13" fill="#3d444d">saves each notification,</text>
  <text x="34" y="364" font-size="13" fill="#3d444d">then pushes it</text>
  <rect x="300" y="322" width="320" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="316" y="348" font-size="14" font-weight="700" fill="#1a1a1a">The Notification table</text>
  <text x="316" y="370" font-size="13" fill="#3d444d">every notification, saved as a row</text>
  <text x="20" y="442" font-size="15" font-weight="700" fill="#cf222e">✗</text>
  <text x="40" y="442" font-size="14" fill="#1a1a1a">A push is lost if the user isn't connected: nothing is replayed later.</text>
  <text x="20" y="470" font-size="15" font-weight="700" fill="#cf222e">✗</text>
  <text x="40" y="470" font-size="14" fill="#1a1a1a">An SLA breach is never pushed: the worker process that finds it has no socket.</text>
  <rect x="160" y="494" width="500" height="44" rx="8" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="410" y="522" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">So REST is the truth, and the socket is a nudge.</text>
</svg>
