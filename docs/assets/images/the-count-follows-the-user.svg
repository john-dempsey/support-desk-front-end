<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The count follows the user</title>
  <desc id="desc">Five moments, top to bottom, each with what runs and the count afterwards. 1, the app starts and nobody is logged in: the effect runs, user is null, so it returns straight away; the count is 0. 2, Alex logs in: the effect runs again because user changed, and loadUnreadCount() asks GET /notifications?unread=true; the count is 3. 3, Alex clicks Mark as read: the page calls refreshUnreadCount(), and the count is 2; the effect doesn't run, because user hasn't changed. 4, Alex logs out: first the cleanup from Alex's run sets ignore to true and the count to 0; then the effect runs with user null and returns. The count is 0. 5, Casey logs in: the effect runs for Casey, and the count is 1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="780" height="470" fill="#ffffff"/>
  <text x="20" y="30" font-size="14" font-weight="700" fill="#1a1a1a">What happens</text>
  <text x="280" y="30" font-size="14" font-weight="700" fill="#1a1a1a">What runs in NotificationsProvider</text>
  <text x="720" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">count</text>
  <rect x="20" y="44" width="220" height="64" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="70" font-size="14" font-weight="700" fill="#1a1a1a">1. The app starts</text>
  <text x="34" y="90" font-size="13" fill="#3d444d">nobody is logged in</text>
  <line x1="244" y1="76" x2="276" y2="76" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="44" width="380" height="64" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="294" y="70" font-size="13" fill="#1a1a1a">the effect runs: <tspan font-family="ui-monospace, Consolas, monospace">user</tspan> is <tspan font-family="ui-monospace, Consolas, monospace">null</tspan>,</text>
  <text x="294" y="90" font-size="13" fill="#1a1a1a">so it returns straight away</text>
  <rect x="680" y="56" width="80" height="40" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="720" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">0</text>
  <rect x="20" y="128" width="220" height="64" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="154" font-size="14" font-weight="700" fill="#1a1a1a">2. Alex logs in</text>
  <text x="34" y="174" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">user</tspan> changes</text>
  <line x1="244" y1="160" x2="276" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="128" width="380" height="64" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="294" y="154" font-size="13" fill="#1a1a1a">the effect runs again: <tspan font-family="ui-monospace, Consolas, monospace">loadUnreadCount()</tspan></text>
  <text x="294" y="174" font-size="13" fill="#1a1a1a">asks <tspan font-family="ui-monospace, Consolas, monospace">GET /notifications?unread=true</tspan></text>
  <rect x="680" y="140" width="80" height="40" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="720" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">3</text>
  <rect x="20" y="212" width="220" height="64" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="238" font-size="14" font-weight="700" fill="#1a1a1a">3. Mark as read</text>
  <text x="34" y="258" font-size="13" fill="#3d444d">on the notifications page</text>
  <line x1="244" y1="244" x2="276" y2="244" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="212" width="380" height="64" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="294" y="238" font-size="13" fill="#1a1a1a">the page calls <tspan font-family="ui-monospace, Consolas, monospace">refreshUnreadCount()</tspan></text>
  <text x="294" y="258" font-size="13" fill="#1a1a1a">(the effect doesn't run: <tspan font-family="ui-monospace, Consolas, monospace">user</tspan> didn't change)</text>
  <rect x="680" y="224" width="80" height="40" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="720" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">2</text>
  <rect x="20" y="296" width="220" height="64" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="322" font-size="14" font-weight="700" fill="#1a1a1a">4. Alex logs out</text>
  <text x="34" y="342" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">user</tspan> becomes <tspan font-family="ui-monospace, Consolas, monospace">null</tspan></text>
  <line x1="244" y1="328" x2="276" y2="328" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="296" width="380" height="64" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="294" y="322" font-size="13" fill="#1a1a1a">Alex's cleanup: <tspan font-family="ui-monospace, Consolas, monospace">ignore = true</tspan>, count 0;</text>
  <text x="294" y="342" font-size="13" fill="#1a1a1a">then the effect runs with <tspan font-family="ui-monospace, Consolas, monospace">null</tspan> and returns</text>
  <rect x="680" y="308" width="80" height="40" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="720" y="334" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">0</text>
  <rect x="20" y="380" width="220" height="64" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="406" font-size="14" font-weight="700" fill="#1a1a1a">5. Casey logs in</text>
  <text x="34" y="426" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">user</tspan> changes</text>
  <line x1="244" y1="412" x2="276" y2="412" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="380" width="380" height="64" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="294" y="406" font-size="13" fill="#1a1a1a">the effect runs for Casey:</text>
  <text x="294" y="426" font-size="13" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">loadUnreadCount()</tspan> again</text>
  <rect x="680" y="392" width="80" height="40" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="720" y="418" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">1</text>
</svg>
