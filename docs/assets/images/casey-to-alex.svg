<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 574" width="860" height="574" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">From Casey's click to Alex's count</title>
  <desc id="desc">Three columns: Casey's browser on the left, the API in the middle, Alex's browser on the right. 1, in Casey's browser: Casey clicks Add comment; TicketDetailPage's handleAddComment() calls createComment(), which sends POST /tickets/1/comments. 2, in the API: comment.service.js saves the comment, works out who to tell (the customer and the assigned agent, minus the author: so just Alex), and emits ticket.commented. 3: notifications.listener.js calls notify() with Alex and a ticketCommented notification. 4: notify.js runs the database channel first, which saves a Notification row, then the realtime channel, which pushes that row as notification.created to Alex's room. 5, in Alex's browser: the shared socket receives notification.created and calls every handler. 6: NotificationsProvider's handler calls loadUnreadCount(), which sends GET /notifications?unread=true. 7, in the API: the answer is Alex's unread notifications, including the row saved in step 4. 8, in Alex's browser: setUnreadCount(4), and NavBar re-renders as Notifications (4 unread).</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="860" height="574" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1a1a1a">Casey's browser</text>
  <text x="310" y="28" font-size="15" font-weight="700" fill="#1a1a1a">The API</text>
  <text x="600" y="28" font-size="15" font-weight="700" fill="#1a1a1a">Alex's browser</text>
  <rect x="20" y="44" width="250" height="84" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="32" y="65" font-size="13" font-weight="700" fill="#1a1a1a">1. Casey clicks Add comment</text>
  <text x="32" y="84" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">handleAddComment()</tspan></text>
  <text x="32" y="101" font-size="12" fill="#1a1a1a">→ <tspan font-family="ui-monospace, Consolas, monospace">createComment()</tspan></text>
  <text x="32" y="118" font-size="12" fill="#1a1a1a">sends <tspan font-family="ui-monospace, Consolas, monospace">POST /tickets/1/comments</tspan></text>
  <rect x="310" y="44" width="250" height="84" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="322" y="65" font-size="13" font-weight="700" fill="#1a1a1a">2. comment.service.js</text>
  <text x="322" y="84" font-size="12" fill="#1a1a1a">saves the comment; who to tell?</text>
  <text x="322" y="101" font-size="12" fill="#1a1a1a">customer + assigned agent − author</text>
  <text x="322" y="118" font-size="12" fill="#1a1a1a">= Alex. Emits <tspan font-family="ui-monospace, Consolas, monospace">ticket.commented</tspan></text>
  <path d="M 270 77 H 306" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="310" y="156" width="250" height="66" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="322" y="177" font-size="13" font-weight="700" fill="#1a1a1a">3. notifications.listener.js</text>
  <text x="322" y="196" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">notify([alex],</tspan></text>
  <text x="322" y="213" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">  ticketCommented(...))</tspan></text>
  <path d="M 340 128 V 152" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="310" y="250" width="250" height="84" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="322" y="271" font-size="13" font-weight="700" fill="#1a1a1a">4. notify.js</text>
  <text x="322" y="290" font-size="12" fill="#1a1a1a">database channel: saves the row</text>
  <text x="322" y="307" font-size="12" fill="#1a1a1a">then realtime channel: pushes it</text>
  <text x="322" y="324" font-size="12" fill="#1a1a1a">to <tspan font-family="ui-monospace, Consolas, monospace">user:&lt;Alex's id&gt;</tspan></text>
  <path d="M 340 222 V 246" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="600" y="250" width="240" height="66" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="612" y="271" font-size="13" font-weight="700" fill="#1a1a1a">5. the shared socket</text>
  <text x="612" y="290" font-size="12" fill="#1a1a1a">receives <tspan font-family="ui-monospace, Consolas, monospace" font-weight="700" fill="#116329">notification.created</tspan></text>
  <text x="612" y="307" font-size="12" fill="#1a1a1a">and calls every handler</text>
  <path d="M 560 283 H 596" fill="none" stroke="#116329" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="344" width="240" height="50" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="612" y="365" font-size="13" font-weight="700" fill="#1a1a1a">6. NotificationsProvider</text>
  <text x="612" y="384" font-size="12" fill="#1a1a1a">handler: <tspan font-family="ui-monospace, Consolas, monospace">loadUnreadCount()</tspan></text>
  <path d="M 640 316 V 340" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="310" y="440" width="250" height="66" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="322" y="461" font-size="13" font-weight="700" fill="#1a1a1a">7. the API answers</text>
  <text x="322" y="480" font-size="12" fill="#1a1a1a">Alex's unread notifications,</text>
  <text x="322" y="497" font-size="12" fill="#1a1a1a">including the row from step 4</text>
  <path d="M 600 380 H 580 V 470 H 564" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="428" font-size="11" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">GET /notifications?unread=true</text>
  <rect x="600" y="470" width="240" height="84" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="612" y="491" font-size="13" font-weight="700" fill="#1a1a1a">8. setUnreadCount(4)</text>
  <text x="612" y="510" font-size="12" fill="#1a1a1a">NavBar re-renders:</text>
  <text x="612" y="527" font-size="12" fill="#1a1a1a">Notifications (4 unread)</text>
  <path d="M 560 490 H 596" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
