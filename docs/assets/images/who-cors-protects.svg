<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Who CORS stops, and who it doesn't</title>
  <desc id="desc">The pinned API in the middle, allowing only localhost:5173 and localhost:8080. Our own pages: allowed, they read the answers. A page on another website: the browser refuses to give it the answer; a request with a token is never sent, but a plain GET still reaches the API and runs. curl or a REST client: CORS doesn't apply, it gets every answer. A WebSocket opened by any page: CORS doesn't apply, the socket opens. What protects the data is the token, checked by authenticate and authorize, and by the authenticate event on the socket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>

  <!-- API in the middle -->
  <rect x="320" y="150" width="220" height="100" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="430" y="178" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">The API, pinned</text>
  <text x="430" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">CORS_ORIGINS=</text>
  <text x="430" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">localhost:5173,</text>
  <text x="430" y="238" font-size="12" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">localhost:8080</text>

  <!-- top left: our pages -->
  <rect x="20" y="20" width="260" height="96" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="44" font-size="14" font-weight="700" fill="#1a1a1a">Our pages, 5173 and 8080</text>
  <text x="34" y="68" font-size="12" fill="#1a1a1a">✓ on the list: the browser</text>
  <text x="34" y="86" font-size="12" fill="#1a1a1a">hands them every answer</text>
  <line x1="282" y1="90" x2="330" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- top right: other website -->
  <rect x="580" y="20" width="260" height="114" rx="8" fill="#ffebe9" stroke="#a40e26" stroke-width="1.5"/>
  <text x="594" y="44" font-size="14" font-weight="700" fill="#1a1a1a">Another website's page</text>
  <text x="594" y="66" font-size="12" fill="#1a1a1a">✗ the browser won't hand it</text>
  <text x="594" y="84" font-size="12" fill="#1a1a1a">the answer. With a token: never</text>
  <text x="594" y="102" font-size="12" fill="#1a1a1a">sent. A plain GET: still reaches</text>
  <text x="594" y="120" font-size="12" fill="#1a1a1a">the API and runs.</text>
  <line x1="578" y1="100" x2="530" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bottom left: curl -->
  <rect x="20" y="276" width="260" height="78" rx="8" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="34" y="300" font-size="14" font-weight="700" fill="#1a1a1a">curl, a REST client</text>
  <text x="34" y="322" font-size="12" fill="#1a1a1a">CORS doesn't apply: not a</text>
  <text x="34" y="340" font-size="12" fill="#1a1a1a">browser. Gets every answer.</text>
  <line x1="282" y1="300" x2="330" y2="252" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bottom right: websocket -->
  <rect x="580" y="276" width="260" height="78" rx="8" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="594" y="300" font-size="14" font-weight="700" fill="#1a1a1a">A WebSocket, from any page</text>
  <text x="594" y="322" font-size="12" fill="#1a1a1a">CORS doesn't apply: not HTTP.</text>
  <text x="594" y="340" font-size="12" fill="#1a1a1a">The socket opens.</text>
  <line x1="578" y1="300" x2="530" y2="252" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bottom band -->
  <rect x="20" y="380" width="820" height="62" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="34" y="404" font-size="13" font-weight="700" fill="#1a1a1a">What protects the data, for all four: the token</text>
  <text x="34" y="426" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">authenticate</tspan> and <tspan font-family="ui-monospace, Consolas, monospace">authorize()</tspan> on every request, and the socket's <tspan font-family="ui-monospace, Consolas, monospace">authenticate</tspan> event before it joins a room.</text>
</svg>
