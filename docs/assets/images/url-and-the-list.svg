<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">From the URL to the list, and back</title>
  <desc id="desc">A loop. 1, the browser's URL is /tickets?status=open&amp;page=2. 2, in TicketListPage, useSearchParams() reads it, and searchParams.toString() gives the queryString 'status=open&amp;page=2'. 3, the effect, which depends on queryString, calls getTickets(queryString) in tickets.api.js, which sends GET /tickets?status=open&amp;page=2. 4, the page calls setTickets and setMeta, and shows the tickets and Page 2 of 3. Then, on the right: 5, the user chooses another status or clicks Next. 6, handleFilterChange or handlePageChange makes a new URLSearchParams and calls setSearchParams, which changes the URL, and the loop starts again at step 1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="20" y="20" width="460" height="64" rx="8" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="34" y="46" font-size="14" fill="#1a1a1a"><tspan font-weight="700">1</tspan>  The URL: <tspan font-family="ui-monospace, Consolas, monospace">/tickets?status=open&amp;page=2</tspan></text>
  <text x="468" y="74" text-anchor="end" font-size="12" fill="#59636e">the browser</text>
  <line x1="250" y1="86" x2="250" y2="108" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="112" width="460" height="84" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="34" y="138" font-size="14" fill="#1a1a1a"><tspan font-weight="700">2</tspan>  <tspan font-family="ui-monospace, Consolas, monospace">useSearchParams()</tspan> reads it;</text>
  <text x="34" y="158" font-size="14" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">queryString</tspan> is <tspan font-family="ui-monospace, Consolas, monospace">'status=open&amp;page=2'</tspan></text>
  <text x="468" y="186" text-anchor="end" font-size="12" fill="#59636e">TicketListPage.jsx</text>
  <line x1="250" y1="198" x2="250" y2="220" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="224" width="460" height="84" rx="8" fill="#fff8c5" stroke="#7d4e00" stroke-width="2"/>
  <text x="34" y="250" font-size="14" fill="#1a1a1a"><tspan font-weight="700">3</tspan>  The effect runs: <tspan font-family="ui-monospace, Consolas, monospace">getTickets(queryString)</tspan></text>
  <text x="34" y="270" font-size="14" fill="#1a1a1a">sends <tspan font-family="ui-monospace, Consolas, monospace">GET /tickets?status=open&amp;page=2</tspan></text>
  <text x="468" y="298" text-anchor="end" font-size="12" fill="#59636e">useEffect → tickets.api.js</text>
  <line x1="250" y1="310" x2="250" y2="332" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="336" width="460" height="64" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="34" y="362" font-size="14" fill="#1a1a1a"><tspan font-weight="700">4</tspan>  <tspan font-family="ui-monospace, Consolas, monospace">setTickets</tspan>, <tspan font-family="ui-monospace, Consolas, monospace">setMeta</tspan>: the list, "Page 2 of 3"</text>
  <text x="468" y="390" text-anchor="end" font-size="12" fill="#59636e">TicketListPage.jsx</text>
  <rect x="540" y="300" width="200" height="100" rx="8" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="554" y="326" font-size="14" fill="#1a1a1a"><tspan font-weight="700">5</tspan>  The user picks</text>
  <text x="554" y="346" font-size="14" fill="#1a1a1a">another status,</text>
  <text x="554" y="366" font-size="14" fill="#1a1a1a">or clicks Next</text>
  <text x="728" y="390" text-anchor="end" font-size="12" fill="#59636e"></text>
  <line x1="640" y1="298" x2="640" y2="206" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="82" width="200" height="122" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="554" y="108" font-size="14" fill="#1a1a1a"><tspan font-weight="700">6</tspan>  <tspan font-family="ui-monospace, Consolas, monospace">handleFilterChange</tspan></text>
  <text x="554" y="128" font-size="14" fill="#1a1a1a">or <tspan font-family="ui-monospace, Consolas, monospace">handlePageChange</tspan>:</text>
  <text x="554" y="148" font-size="14" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">setSearchParams(…)</tspan></text>
  <text x="728" y="194" text-anchor="end" font-size="12" fill="#59636e">TicketListPage.jsx</text>
  <path d="M640 80 L640 52 L486 52" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="64" font-size="12" fill="#59636e">the URL changes</text>
  <line x1="482" y1="368" x2="536" y2="368" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
</svg>
