<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The error boundary around the routes</title>
  <desc id="desc">On the left, App's tree in Stage 6: NavBar first, then main, and inside main the ErrorBoundary, with key set to the path, around the Routes and whichever page the URL matches. When a page throws while rendering, everything inside the boundary is replaced by the fallback: Something went wrong, and a link home. NavBar is outside the boundary, so it stays, and the user can click another link. On the right, without a boundary, as in Stage 5: React removes the whole app, NavBar included, and the page is blank. At the bottom: key equals location.pathname, so a new path means a new ErrorBoundary, which starts with no error.</desc>
  <rect width="860" height="430" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="700" fill="#1a1a1a">Stage 6: a page crashes</text>
  <text x="560" y="30" font-size="16" font-weight="700" fill="#1a1a1a">Stage 5: a page crashes</text>

  <rect x="20" y="46" width="500" height="300" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="34" y="70" font-size="14" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">App</text>

  <rect x="34" y="82" width="472" height="44" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="48" y="109" font-size="13" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">NavBar</text>
  <text x="140" y="109" font-size="12" fill="#3d444d">outside the boundary: still works</text>

  <rect x="34" y="138" width="472" height="196" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="48" y="160" font-size="13" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">main</text>

  <rect x="48" y="172" width="444" height="150" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="62" y="194" font-size="13" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">ErrorBoundary key={path}</text>
  <text x="62" y="214" font-size="12" fill="#3d444d">everything inside is swapped for the fallback:</text>
  <rect x="62" y="226" width="416" height="82" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="76" y="252" font-size="15" font-weight="700" fill="#1a1a1a">Something went wrong</text>
  <text x="76" y="274" font-size="12" fill="#3d444d">Sorry, this page stopped working. …</text>
  <text x="76" y="294" font-size="12" fill="#0550ae" text-decoration="underline">Go to the home page</text>

  <rect x="560" y="46" width="280" height="300" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="700" y="180" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">a blank page</text>
  <text x="700" y="204" font-size="12" fill="#3d444d" text-anchor="middle">React removes the whole app,</text>
  <text x="700" y="222" font-size="12" fill="#3d444d" text-anchor="middle">NavBar included: nothing to click</text>

  <rect x="20" y="364" width="820" height="50" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="34" y="394" font-size="13" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">key={location.pathname}</tspan>: a new path means a new ErrorBoundary, which starts with no error.</text>
</svg>
