<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Deleting a ticket</title>
  <desc id="desc">A flowchart. 1: the user clicks Delete ticket. 2: window.confirm asks whether to delete the ticket. If the user clicks Cancel, confirm returns false, and the function returns: nothing happens. If the user clicks OK, it returns true, and 3: deleteTicket(ticket.id) sends DELETE /tickets/:id. If the API answers 204 No Content, navigate('/tickets') goes to the list, which loads without the deleted ticket. If it answers 409, 403 or 404, the catch calls setDeleteErrorMessage with the error's message, and the message is shown under the buttons.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>
  <rect x="170" y="20" width="400" height="44" rx="8" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="186" y="47" font-size="15" fill="#1a1a1a"><tspan font-weight="700">1</tspan>  The user clicks <tspan font-weight="700">Delete ticket</tspan></text>
  <line x1="370" y1="66" x2="370" y2="90" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="94" width="400" height="44" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="186" y="121" font-size="15" fill="#1a1a1a"><tspan font-weight="700">2</tspan>  <tspan font-family="ui-monospace, Consolas, monospace">window.confirm(…)</tspan>: "Delete the ticket …?"</text>
  <line x1="572" y1="116" x2="626" y2="116" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="599" y="106" text-anchor="middle" font-size="14" fill="#1a1a1a">Cancel</text>
  <rect x="630" y="94" width="120" height="44" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="2"/>
  <text x="646" y="121" font-size="15" fill="#1a1a1a">nothing</text>
  <line x1="370" y1="140" x2="370" y2="170" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="160" text-anchor="start" font-size="14" fill="#1a1a1a">OK</text>
  <rect x="170" y="174" width="400" height="66" rx="8" fill="#fff8c5" stroke="#7d4e00" stroke-width="2"/>
  <text x="186" y="201" font-size="15" fill="#1a1a1a"><tspan font-weight="700">3</tspan>  <tspan font-family="ui-monospace, Consolas, monospace">deleteTicket(ticket.id)</tspan></text>
  <text x="186" y="223" font-size="15" fill="#1a1a1a">     sends <tspan font-family="ui-monospace, Consolas, monospace">DELETE /tickets/:id</tspan></text>
  <line x1="320" y1="242" x2="200" y2="282" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="242" x2="540" y2="282" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="262" text-anchor="end" font-size="14" font-weight="700" fill="#116329">204 No Content</text>
  <text x="515" y="262" text-anchor="start" font-size="14" font-weight="700" fill="#cf222e">409, 403 or 404</text>
  <rect x="30" y="286" width="330" height="90" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="46" y="313" font-size="15" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">navigate('/tickets')</tspan></text>
  <text x="46" y="335" font-size="15" fill="#1a1a1a">the list loads, without the ticket</text>
  <text x="46" y="357" font-size="12" fill="#59636e">TicketDetailPage.jsx → TicketListPage.jsx</text>
  <rect x="400" y="286" width="340" height="90" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="416" y="313" font-size="15" fill="#1a1a1a">catch: <tspan font-family="ui-monospace, Consolas, monospace">setDeleteErrorMessage(…)</tspan></text>
  <text x="416" y="335" font-size="15" fill="#1a1a1a">the message shows under the buttons</text>
  <text x="416" y="357" font-size="12" fill="#59636e">TicketDetailPage.jsx</text>
</svg>
