<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Real and fake sockets in the tests</title>
  <desc id="desc">Three kinds of test, side by side. On the left, socket.test.js: the real socket.js, with socket.io-client faked by vi.mock and a factory, so io() returns a fake socket whose on and off really store handlers, and whose fire() calls them. In the middle, the provider and page tests, such as NotificationsPage.test.jsx: the real component, with socket.js itself faked by vi.mock, and captureNotificationHandler() keeping the handler the component passes to onNotification(), so the test can push a notification. The API modules are faked too, as in every page test. On the right, App.test.jsx: the real AuthProvider and NotificationsProvider around the real App, with socket.js and every API module faked, so nothing connects to anything.</desc>
  <rect width="820" height="470" fill="#ffffff"/>
  <rect x="20" y="20" width="250" height="400" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="34" y="46" font-size="14" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">socket.test.js</text>
  <text x="34" y="66" font-size="12" fill="#3d444d">tests socket.js itself</text>
  <rect x="34" y="84" width="222" height="56" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/><text x="46" y="105" font-size="13" font-weight="700" fill="#1a1a1a">socket.js</text><text x="46" y="123" font-size="12" fill="#3d444d">the real file</text>
  <rect x="34" y="158" width="222" height="92" rx="6" fill="#ffffff" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="6 4"/><text x="46" y="179" font-size="13" font-weight="700" fill="#7d4e00">socket.io-client</text><text x="46" y="197" font-size="12" fill="#3d444d">vi.mock with a factory: io()</text><text x="46" y="214" font-size="12" fill="#3d444d">returns a fake socket</text>
  <text x="46" y="272" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">on</tspan>/<tspan font-family="ui-monospace, Consolas, monospace">off</tspan> keep handlers;</text><text x="46" y="290" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">fire()</tspan> plays the server</text>
  <rect x="285" y="20" width="250" height="400" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="299" y="46" font-size="14" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">NotificationsPage.test</text>
  <text x="299" y="66" font-size="12" fill="#3d444d">the provider and page tests</text>
  <rect x="299" y="84" width="222" height="56" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/><text x="311" y="105" font-size="13" font-weight="700" fill="#1a1a1a">the component</text><text x="311" y="123" font-size="12" fill="#3d444d">real: page or provider</text>
  <rect x="299" y="158" width="222" height="92" rx="6" fill="#ffffff" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="6 4"/><text x="311" y="179" font-size="13" font-weight="700" fill="#7d4e00">socket.js</text><text x="311" y="197" font-size="12" fill="#3d444d">vi.mock: every function</text><text x="311" y="214" font-size="12" fill="#3d444d">is a vi.fn()</text>
  <rect x="299" y="268" width="222" height="76" rx="6" fill="#ffffff" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="6 4"/><text x="311" y="289" font-size="13" font-weight="700" fill="#7d4e00">the API modules</text><text x="311" y="307" font-size="12" fill="#3d444d">vi.mock, as in every</text><text x="311" y="324" font-size="12" fill="#3d444d">page test</text>
  <text x="311" y="372" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">captureNotificationHandler()</tspan></text><text x="311" y="390" font-size="12" fill="#1a1a1a">keeps the handler; <tspan font-family="ui-monospace, Consolas, monospace">push()</tspan> calls it</text>
  <rect x="550" y="20" width="250" height="400" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="564" y="46" font-size="14" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">App.test.jsx</text>
  <text x="564" y="66" font-size="12" fill="#3d444d">the whole-visit test</text>
  <rect x="564" y="84" width="222" height="56" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/><text x="576" y="105" font-size="13" font-weight="700" fill="#1a1a1a">AuthProvider</text><text x="576" y="123" font-size="12" fill="#3d444d">and NotificationsProvider</text>
  <rect x="564" y="148" width="222" height="56" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/><text x="576" y="169" font-size="13" font-weight="700" fill="#1a1a1a">App</text><text x="576" y="187" font-size="12" fill="#3d444d">every page and component</text>
  <rect x="564" y="216" width="222" height="76" rx="6" fill="#ffffff" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="6 4"/><text x="576" y="237" font-size="13" font-weight="700" fill="#7d4e00">socket.js</text><text x="576" y="255" font-size="12" fill="#3d444d">vi.mock, so nothing</text><text x="576" y="272" font-size="12" fill="#3d444d">connects</text>
  <rect x="564" y="304" width="222" height="76" rx="6" fill="#ffffff" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="6 4"/><text x="576" y="325" font-size="13" font-weight="700" fill="#7d4e00">every API module</text><text x="576" y="343" font-size="12" fill="#3d444d">vi.mock</text><text x="576" y="360" font-size="12" fill="#3d444d"></text>
  <rect x="20" y="436" width="16" height="16" rx="3" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="42" y="449" font-size="12" fill="#1a1a1a">real code</text>
  <rect x="130" y="436" width="16" height="16" rx="3" fill="#ffffff" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="152" y="449" font-size="12" fill="#1a1a1a">faked: where the app would reach outside itself</text>
</svg>
