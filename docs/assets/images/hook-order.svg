<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The order hooks run in around one test</title>
  <desc id="desc">Hooks wrap a test like layers. Before the test starts, Vitest undoes the last test's fakes, because of mockReset and unstubGlobals. Then the beforeEach hooks run from the outside in: setup.js's, then the test file's top level, then the describe's. Then the test. Then the afterEach hooks run from the inside out: the describe's, the file's, and last setup.js's, which calls cleanup(). Then the same again for the next test.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="860" height="380" fill="#ffffff"/>

  <rect x="20" y="40" width="150" height="250" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="95" y="66" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Vitest itself</text>
  <text x="95" y="96" font-size="12" fill="#1a1a1a" text-anchor="middle">undoes the last</text>
  <text x="95" y="114" font-size="12" fill="#1a1a1a" text-anchor="middle">test's fakes</text>
  <text x="95" y="146" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">mockReset</text>
  <text x="95" y="164" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">unstubGlobals</text>
  <text x="95" y="196" font-size="11" fill="#3d444d" text-anchor="middle">before each test,</text>
  <text x="95" y="212" font-size="11" fill="#3d444d" text-anchor="middle">not after it</text>

  <line x1="172" y1="165" x2="190" y2="165" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="194" y="20" width="646" height="290" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="517" y="42" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">setup.js (runs in every file)</text>

  <rect x="304" y="54" width="426" height="244" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="517" y="76" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">the test file's top level</text>

  <rect x="414" y="88" width="206" height="198" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="517" y="110" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">inside describe()</text>

  <rect x="444" y="140" width="146" height="54" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="517" y="164" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">the test</text>
  <text x="517" y="182" font-size="11" fill="#3d444d" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">it('...', ...)</text>

  <g font-size="11" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">
    <text x="204" y="150">beforeEach</text>
    <text x="204" y="166" font-family="system-ui, sans-serif" fill="#3d444d">1st</text>
    <text x="314" y="150">beforeEach</text>
    <text x="314" y="166" font-family="system-ui, sans-serif" fill="#3d444d">2nd</text>
    <text x="420" y="214">beforeEach</text>
    <text x="420" y="230" font-family="system-ui, sans-serif" fill="#3d444d">3rd</text>
    <text x="540" y="214">afterEach</text>
    <text x="540" y="230" font-family="system-ui, sans-serif" fill="#3d444d">5th</text>
    <text x="640" y="150">afterEach</text>
    <text x="640" y="166" font-family="system-ui, sans-serif" fill="#3d444d">6th</text>
    <text x="750" y="150">afterEach</text>
    <text x="750" y="166" font-family="system-ui, sans-serif" fill="#3d444d">7th, last:</text>
    <text x="750" y="182">cleanup()</text>
  </g>
  <text x="517" y="132" font-size="11" fill="#3d444d" text-anchor="middle">4th</text>

  <rect x="20" y="326" width="820" height="40" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="34" y="344" font-size="12" fill="#1a1a1a">beforeEach hooks run from the outside in, afterEach hooks from the inside out. Then it all happens again</text>
  <text x="34" y="360" font-size="12" fill="#1a1a1a">for the next test. In Stage 0, only setup.js has a hook: the afterEach that calls cleanup().</text>
</svg>
