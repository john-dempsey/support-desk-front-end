<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A slow answer arrives last</title>
  <desc id="desc">A timeline of two requests. First, the user chooses Open, and request A, GET /tickets?status=open, starts; it is slow. A moment later the user chooses Closed: the first effect's cleanup sets its ignore to true, and request B, GET /tickets?status=closed, starts; it is fast. B's answer arrives first, and the page shows the closed tickets. Then A's answer arrives. With the ignore flag, A's effect sees ignore is true and does nothing, so the page still shows the closed tickets, matching the dropdown. Without the flag, A's open tickets would replace the closed ones, while the dropdown still says Closed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="100" y="70" width="520" height="34" rx="5" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="112" y="92" font-size="13" fill="#1a1a1a"><tspan font-weight="700">A</tspan>  <tspan font-family="ui-monospace, Consolas, monospace">GET /tickets?status=open</tspan>  (slow)</text>
  <rect x="260" y="150" width="200" height="34" rx="5" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="272" y="172" font-size="13" fill="#1a1a1a"><tspan font-weight="700">B</tspan>  <tspan font-family="ui-monospace, Consolas, monospace">…status=closed</tspan></text>
  <line x1="100" y1="40" x2="100" y2="226" stroke="#59636e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="100" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">choose Open</text>
  <text x="100" y="244" text-anchor="middle" font-size="12" fill="#1a1a1a">A starts</text>
  <line x1="260" y1="40" x2="260" y2="226" stroke="#59636e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="260" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">choose Closed</text>
  <text x="260" y="244" text-anchor="middle" font-size="12" fill="#1a1a1a">cleanup sets A's ignore; B starts</text>
  <line x1="460" y1="40" x2="460" y2="226" stroke="#59636e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="460" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#116329">B arrives</text>
  <text x="460" y="244" text-anchor="middle" font-size="12" fill="#116329">closed tickets shown</text>
  <line x1="620" y1="40" x2="620" y2="226" stroke="#59636e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="620" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#116329">A arrives</text>
  <text x="620" y="244" text-anchor="middle" font-size="12" fill="#116329">ignored</text>
  <line x1="40" y1="206" x2="720" y2="206" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="720" y="198" text-anchor="end" font-size="12" fill="#59636e">time</text>
  <rect x="20" y="270" width="350" height="70" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="36" y="296" font-size="14" font-weight="700" fill="#116329">✓ With the ignore flag</text>
  <text x="36" y="320" font-size="13" fill="#1a1a1a">A does nothing: the closed tickets stay</text>
  <rect x="390" y="270" width="350" height="70" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="406" y="296" font-size="14" font-weight="700" fill="#cf222e">✗ Without it</text>
  <text x="406" y="320" font-size="13" fill="#1a1a1a">open tickets, under a dropdown saying Closed</text>
</svg>
