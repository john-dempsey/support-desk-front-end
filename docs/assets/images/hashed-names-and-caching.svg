<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Hashed names and caching</title>
  <desc id="desc">Two visits, before and after a new build. Visit 1: the browser asks nginx for index.html, which is no-cache, so it always asks; nginx answers 304 Not Modified. index.html names index-CPcL75JA.js, which the browser already has, so it uses its copy without asking. Then a new build. Visit 2: the browser asks for index.html again and gets the new one, which names index-CdEXSmY8.js. That's a name the browser has never seen, so it downloads it. The old file is never asked for again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="860" height="420" fill="#ffffff"/>

  <text x="20" y="34" font-size="15" font-weight="700" fill="#1a1a1a">Visit 1: nothing has changed</text>
  <rect x="20" y="48" width="400" height="58" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="34" y="70" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace" font-weight="700">index.html</tspan>  (no-cache: always ask)</text>
  <text x="34" y="92" font-size="12" fill="#3d444d">asks nginx → <tspan font-weight="700" fill="#1a1a1a">304 Not Modified</tspan>, use your copy</text>
  <line x1="120" y1="108" x2="120" y2="128" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="122" font-size="11" fill="#3d444d">which names</text>
  <rect x="20" y="132" width="400" height="58" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="34" y="154" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace" font-weight="700">assets/index-CPcL75JA.js</text>
  <text x="34" y="176" font-size="12" fill="#3d444d">already in the cache, kept for a year → <tspan font-weight="700" fill="#1a1a1a">not even asked</tspan></text>

  <!-- divider -->
  <line x1="440" y1="40" x2="440" y2="300" stroke="#d1d9e0" stroke-width="1"/>

  <text x="460" y="34" font-size="15" font-weight="700" fill="#1a1a1a">Visit 2: after a new build</text>
  <rect x="460" y="48" width="380" height="58" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="474" y="70" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace" font-weight="700">index.html</tspan>  (no-cache: always ask)</text>
  <text x="474" y="92" font-size="12" fill="#3d444d">asks nginx → <tspan font-weight="700" fill="#1a1a1a">200</tspan>, the new index.html</text>
  <line x1="560" y1="108" x2="560" y2="128" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="122" font-size="11" fill="#3d444d">which names</text>
  <rect x="460" y="132" width="380" height="58" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="474" y="154" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace" font-weight="700">assets/index-CdEXSmY8.js</text>
  <text x="474" y="176" font-size="12" fill="#3d444d">a name it's never seen → <tspan font-weight="700" fill="#1a1a1a">downloads it</tspan></text>

  <rect x="460" y="210" width="380" height="58" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="474" y="232" font-size="12" fill="#59636e" font-family="ui-monospace, Consolas, monospace">assets/index-CPcL75JA.js</text>
  <text x="474" y="254" font-size="12" fill="#59636e">still in the cache, but nothing names it any more</text>

  <rect x="20" y="300" width="820" height="104" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="34" y="326" font-size="14" font-weight="700" fill="#1a1a1a">Two rules in nginx.conf, working together</text>
  <text x="34" y="350" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">location /</tspan>  →  <tspan font-family="ui-monospace, Consolas, monospace">no-cache</tspan>: index.html is small and always checked, so a new build is seen at once.</text>
  <text x="34" y="374" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">location /assets/</tspan>  →  <tspan font-family="ui-monospace, Consolas, monospace">max-age=31536000, immutable</tspan>: a name's content never changes,</text>
  <text x="34" y="392" font-size="12" fill="#1a1a1a">so the 329 kB file is downloaded once per build, not once per visit.</text>
</svg>
