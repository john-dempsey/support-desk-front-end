<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A new array, not a changed one</title>
  <desc id="desc">Three ways to change the comments list. 1, adding with [...comments, newComment]: the old array, holding comments 1 and 2, is left as it is, and a new array holding 1, 2 and 3 is made; setComments gets a different array, so React re-renders and the list shows three comments. 2, adding with comments.push(newComment): comment 3 is pushed into the old array itself, and there is no new array; setComments gets the same array it already had, so React skips the re-render and the screen still shows two comments. 3, deleting with comments.filter(...): the old array, holding 1, 2 and 3, is left as it is, and a new array holding 1 and 3 is made, so React re-renders.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#116329">✓ 1</text>
  <text x="62" y="30" font-size="14" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">setComments([...comments, newComment])</text>
  <rect x="20" y="44" width="108" height="48" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
  <rect x="30" y="52" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="48" y="73" text-anchor="middle" font-size="14" fill="#1a1a1a">#1</text>
  <rect x="74" y="52" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="92" y="73" text-anchor="middle" font-size="14" fill="#1a1a1a">#2</text>
  <text x="20" y="110" font-size="12" fill="#59636e">the old array: untouched</text>
  <line x1="136" y1="68" x2="180" y2="68" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="188" y="44" width="152" height="48" rx="6" fill="#ffffff" stroke="#116329" stroke-width="2"/>
  <rect x="198" y="52" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="216" y="73" text-anchor="middle" font-size="14" fill="#1a1a1a">#1</text>
  <rect x="242" y="52" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="260" y="73" text-anchor="middle" font-size="14" fill="#1a1a1a">#2</text>
  <rect x="286" y="52" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="304" y="73" text-anchor="middle" font-size="14" fill="#1a1a1a">#3</text>
  <text x="188" y="110" font-size="12" fill="#59636e">a new array</text>
  <text x="440" y="66" font-size="14" fill="#116329" font-weight="700">React re-renders</text>
  <text x="440" y="86" font-size="13" fill="#1a1a1a">the list shows 3 comments</text>
  <text x="20" y="160" font-size="15" font-weight="700" fill="#cf222e">✗ 2</text>
  <text x="62" y="160" font-size="14" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">comments.push(newComment); setComments(comments)</text>
  <rect x="20" y="174" width="152" height="48" rx="6" fill="#ffffff" stroke="#cf222e" stroke-width="2"/>
  <rect x="30" y="182" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="48" y="203" text-anchor="middle" font-size="14" fill="#1a1a1a">#1</text>
  <rect x="74" y="182" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="92" y="203" text-anchor="middle" font-size="14" fill="#1a1a1a">#2</text>
  <rect x="118" y="182" width="36" height="32" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="136" y="203" text-anchor="middle" font-size="14" fill="#1a1a1a">#3</text>
  <text x="20" y="240" font-size="12" fill="#59636e">one array: #3 pushed into the old one, and no new array</text>
  <text x="440" y="196" font-size="14" fill="#cf222e" font-weight="700">React skips the re-render</text>
  <text x="440" y="216" font-size="13" fill="#1a1a1a">the screen still shows 2</text>
  <text x="20" y="290" font-size="15" font-weight="700" fill="#116329">✓ 3</text>
  <text x="62" y="290" font-size="14" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">setComments(comments.filter(...))</text>
  <rect x="20" y="304" width="152" height="48" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
  <rect x="30" y="312" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="48" y="333" text-anchor="middle" font-size="14" fill="#1a1a1a">#1</text>
  <rect x="74" y="312" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="92" y="333" text-anchor="middle" font-size="14" fill="#1a1a1a">#2</text>
  <rect x="118" y="312" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="136" y="333" text-anchor="middle" font-size="14" fill="#1a1a1a">#3</text>
  <text x="20" y="370" font-size="12" fill="#59636e">the old array: untouched</text>
  <line x1="180" y1="328" x2="224" y2="328" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="232" y="304" width="108" height="48" rx="6" fill="#ffffff" stroke="#116329" stroke-width="2"/>
  <rect x="242" y="312" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="260" y="333" text-anchor="middle" font-size="14" fill="#1a1a1a">#1</text>
  <rect x="286" y="312" width="36" height="32" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="304" y="333" text-anchor="middle" font-size="14" fill="#1a1a1a">#3</text>
  <text x="232" y="370" font-size="12" fill="#59636e">a new array, without #2</text>
  <text x="440" y="326" font-size="14" fill="#116329" font-weight="700">React re-renders</text>
  <text x="440" y="346" font-size="13" fill="#1a1a1a">the list shows 2 comments</text>
</svg>
