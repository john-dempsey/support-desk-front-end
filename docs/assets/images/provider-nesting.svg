<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The providers around the app</title>
  <desc id="desc">Nested boxes. The outermost is BrowserRouter, then AuthProvider, which holds user, login and logout. Inside it is NotificationsProvider, which holds unreadCount and refreshUnreadCount, and reads user from AuthProvider with useAuth(), shown by an arrow going up. Inside that is App, which renders NavBar and the Routes. NavBar reads unreadCount with useNotifications(), and NotificationsPage, inside the Routes, calls refreshUnreadCount(); both are shown by arrows going up to NotificationsProvider. NotificationsProvider must be inside AuthProvider, because useAuth() only finds a provider above it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <rect x="20" y="20" width="720" height="390" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="36" y="44" font-size="14" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">&lt;BrowserRouter&gt;</text>
  <rect x="40" y="58" width="680" height="336" rx="8" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="56" y="84" font-size="14" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">&lt;AuthProvider&gt;</text>
  <text x="220" y="84" font-size="13" fill="#3d444d">holds <tspan font-family="ui-monospace, Consolas, monospace">user</tspan>, <tspan font-family="ui-monospace, Consolas, monospace">login</tspan>, <tspan font-family="ui-monospace, Consolas, monospace">logout</tspan>, ...</text>
  <rect x="60" y="102" width="640" height="276" rx="8" fill="#ffffff" stroke="#0550ae" stroke-width="2"/>
  <text x="76" y="128" font-size="14" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">&lt;NotificationsProvider&gt;</text>
  <text x="76" y="150" font-size="13" fill="#3d444d">holds <tspan font-family="ui-monospace, Consolas, monospace">unreadCount</tspan> and <tspan font-family="ui-monospace, Consolas, monospace">refreshUnreadCount</tspan></text>
  <path d="M 600 122 V 90" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="608" y="116" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">useAuth()</text>
  <rect x="80" y="170" width="600" height="192" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="96" y="194" font-size="14" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">&lt;App&gt;</text>
  <rect x="100" y="250" width="220" height="92" rx="6" fill="#ffffff" stroke="#116329" stroke-width="1.5"/>
  <text x="114" y="274" font-size="14" font-weight="700" fill="#1a1a1a">NavBar</text>
  <text x="114" y="296" font-size="12" fill="#3d444d">reads <tspan font-family="ui-monospace, Consolas, monospace">unreadCount</tspan></text>
  <text x="114" y="314" font-size="12" fill="#3d444d">"Notifications (3 unread)"</text>
  <rect x="340" y="250" width="320" height="92" rx="6" fill="#ffffff" stroke="#116329" stroke-width="1.5"/>
  <text x="354" y="274" font-size="14" font-weight="700" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">&lt;Routes&gt;</tspan> → NotificationsPage</text>
  <text x="354" y="296" font-size="12" fill="#3d444d">calls <tspan font-family="ui-monospace, Consolas, monospace">refreshUnreadCount()</tspan></text>
  <text x="354" y="314" font-size="12" fill="#3d444d">after Mark as read</text>
  <path d="M 210 248 V 160" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="218" y="226" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">useNotifications()</text>
  <path d="M 500 248 V 160" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="226" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">useNotifications()</text>
  <text x="380" y="440" text-anchor="middle" font-size="14" fill="#1a1a1a">A hook only finds a provider <tspan font-weight="700">above</tspan> it, so NotificationsProvider must be inside AuthProvider.</text>
</svg>
