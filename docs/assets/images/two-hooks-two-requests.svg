<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two hooks, two requests, at the same time</title>
  <desc id="desc">TicketDetailPage calls useFetch twice in the same render: once with getTicket and the ticket ID, and once with getComments and the ticket ID. Each call has its own effect, and React runs both effects after that one render, so both requests leave together: GET /tickets/1 and GET /tickets/1/comments, both starting at 0 milliseconds in the browser, one finishing after 8 and the other after 11. The page shows Loading the ticket while either is still loading, and the ticket and its comments once both have answered.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>

  <rect x="20" y="20" width="250" height="210" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="46" font-size="15" font-weight="700" fill="#1a1a1a">TicketDetailPage</text>
  <text x="34" y="66" font-size="12" fill="#3d444d">one render, two calls</text>
  <rect x="34" y="82" width="222" height="56" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="46" y="104" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">useFetch(getTicket,</text>
  <text x="116" y="124" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">ticketId)</text>
  <rect x="34" y="154" width="222" height="56" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="46" y="176" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">useFetch(getComments,</text>
  <text x="116" y="196" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">ticketId)</text>

  <line x1="258" y1="110" x2="318" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="258" y1="182" x2="318" y2="182" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="322" y="82" width="170" height="56" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="334" y="104" font-size="13" font-weight="700" fill="#1a1a1a">its own effect</text>
  <text x="334" y="124" font-size="12" fill="#3d444d">runs after the render</text>
  <rect x="322" y="154" width="170" height="56" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="334" y="176" font-size="13" font-weight="700" fill="#1a1a1a">its own effect</text>
  <text x="334" y="196" font-size="12" fill="#3d444d">runs after the render</text>

  <line x1="494" y1="110" x2="548" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="494" y1="182" x2="548" y2="182" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="552" y="60" font-size="13" font-weight="700" fill="#1a1a1a">In the Network tab</text>
  <text x="552" y="76" font-size="11" fill="#59636e">0 ms</text>
  <text x="827" y="76" font-size="11" fill="#59636e" text-anchor="end">11 ms</text>
  <line x1="552" y1="82" x2="840" y2="82" stroke="#d1d9e0" stroke-width="1"/>
  <rect x="552" y="96" width="200" height="28" rx="4" fill="#fff8c5" stroke="#7d4e00"/>
  <text x="560" y="115" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">GET /tickets/1</text>
  <rect x="552" y="168" width="275" height="28" rx="4" fill="#fff8c5" stroke="#7d4e00"/>
  <text x="560" y="187" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">GET /tickets/1/comments</text>
  <text x="552" y="222" font-size="12" fill="#3d444d">both leave together; neither waits for the other</text>

  <rect x="20" y="260" width="820" height="120" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="34" y="286" font-size="14" font-weight="700" fill="#1a1a1a">What the page shows</text>
  <text x="34" y="312" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">isTicketLoading || areCommentsLoading</text>
  <text x="352" y="312" font-size="13" fill="#3d444d">→ "Loading the ticket…" until both have answered</text>
  <text x="34" y="338" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">ticketError || commentsError</text>
  <text x="352" y="338" font-size="13" fill="#3d444d">→ whichever error there is</text>
  <text x="34" y="364" font-size="13" fill="#3d444d">Otherwise, the ticket and its comments, together.</text>
</svg>
