<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The old list and the current list</title>
  <desc id="desc">Three moments in NotificationsPage. Render 1: the page opens, notifications is null. The effect runs, because it's the first render, and registers handleNotification, which can only see this render's notifications: null. Render 2: the list has loaded, and notifications is notification 6 and notification 5. The effect doesn't run again, because its dependency list is empty, so the socket still has the handler from render 1. A push arrives with notification 8. With the plain form, the handler builds 8 followed by the spread of null, which throws: notifications is not iterable. If the list had started as an empty array instead, the handler would build a list of just 8, and 6 and 5 would vanish from the screen. With the function form, React passes in the list as it is now, 6 and 5, and the handler returns 8, 6, 5.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="820" height="470" fill="#ffffff"/>
  <rect x="20" y="20" width="780" height="76" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="44" font-size="14" font-weight="700" fill="#1a1a1a">Render 1: the page opens</text>
  <text x="34" y="68" font-size="13" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">notifications</tspan> is <tspan font-family="ui-monospace, Consolas, monospace">null</tspan></text>
  <rect x="400" y="32" width="384" height="52" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="414" y="54" font-size="13" fill="#1a1a1a">the effect runs, and registers <tspan font-family="ui-monospace, Consolas, monospace">handleNotification</tspan></text>
  <text x="414" y="74" font-size="13" font-weight="700" fill="#1a1a1a">it sees this render's list: <tspan font-family="ui-monospace, Consolas, monospace">null</tspan></text>
  <line x1="60" y1="96" x2="60" y2="118" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="120" width="780" height="76" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="144" font-size="14" font-weight="700" fill="#1a1a1a">Render 2: the list has loaded</text>
  <text x="34" y="168" font-size="13" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">notifications</tspan> is</text>
  <rect x="176" y="150" width="52" height="30" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/><text x="202" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">#6</text>
  <rect x="234" y="150" width="52" height="30" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/><text x="260" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">#5</text>
  <rect x="400" y="132" width="384" height="52" rx="6" fill="#ffffff" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="414" y="154" font-size="13" fill="#1a1a1a">the effect doesn't run again (<tspan font-family="ui-monospace, Consolas, monospace">[]</tspan>), so the</text>
  <text x="414" y="174" font-size="13" fill="#1a1a1a">socket still has render 1's handler, which sees <tspan font-family="ui-monospace, Consolas, monospace">null</tspan></text>
  <line x1="60" y1="196" x2="60" y2="218" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="242" font-size="14" font-weight="700" fill="#1a1a1a">A push arrives:</text>
  <rect x="150" y="222" width="52" height="30" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/><text x="176" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">#8</text>
  <rect x="20" y="266" width="380" height="186" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="34" y="290" font-size="14" font-weight="700" fill="#cf222e">✗ The plain form</text>
  <text x="34" y="312" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">setNotifications(</text>
  <text x="34" y="328" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">  [newNotification, ...notifications])</text>
  <text x="34" y="354" font-size="13" fill="#1a1a1a">uses the handler's list: <tspan font-family="ui-monospace, Consolas, monospace">null</tspan></text>
  <text x="34" y="376" font-size="13" font-weight="700" fill="#cf222e" font-family="ui-monospace, Consolas, monospace">TypeError: notifications is not iterable</text>
  <text x="34" y="404" font-size="13" fill="#1a1a1a">If it had started as <tspan font-family="ui-monospace, Consolas, monospace">[]</tspan>, the list becomes</text>
  <rect x="34" y="416" width="52" height="30" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/><text x="60" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">#8</text>
  <text x="98" y="436" font-size="13" fill="#1a1a1a">only: #6 and #5 vanish</text>
  <rect x="420" y="266" width="380" height="186" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="434" y="290" font-size="14" font-weight="700" fill="#116329">✓ The function form</text>
  <text x="434" y="312" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">setNotifications((currentNotifications) =&gt;</text>
  <text x="434" y="328" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">  [newNotification, ...currentNotifications])</text>
  <text x="434" y="354" font-size="13" fill="#1a1a1a">React passes in the list as it is now:</text>
  <rect x="434" y="366" width="52" height="30" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/><text x="460" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">#6</text>
  <rect x="492" y="366" width="52" height="30" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/><text x="518" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">#5</text>
  <text x="434" y="420" font-size="13" fill="#1a1a1a">and the new list is</text>
  <rect x="560" y="402" width="52" height="30" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/><text x="586" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">#8</text>
  <rect x="618" y="402" width="52" height="30" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/><text x="644" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">#6</text>
  <rect x="676" y="402" width="52" height="30" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/><text x="702" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">#5</text>
</svg>
