<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">From /tickets/2 to the ticket's page</title>
  <desc id="desc">Five steps. 1: the address bar holds /tickets/2. 2: in App.jsx, Routes matches the pattern /tickets/:ticketId and picks TicketDetailPage. 3: in TicketDetailPage, useParams() gives an object whose ticketId is the string "2". 4: find() compares each sample ticket's id with Number of that string, and finds ticket 2. 5: the page shows ticket 2, Invoice discrepancy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>

  <!-- 1 -->
  <rect x="20" y="20" width="720" height="52" rx="8" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="40" y="52" font-size="15" fill="#1a1a1a"><tspan font-weight="700">1</tspan>  The address bar says <tspan font-family="ui-monospace, Consolas, monospace">/tickets/2</tspan></text>
  <text x="725" y="52" text-anchor="end" font-size="13" fill="#59636e">browser</text>
  <line x1="380" y1="74" x2="380" y2="92" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect x="20" y="96" width="720" height="52" rx="8" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="40" y="128" font-size="15" fill="#1a1a1a"><tspan font-weight="700">2</tspan>  <tspan font-family="ui-monospace, Consolas, monospace">/tickets/:ticketId</tspan> matches: show TicketDetailPage</text>
  <text x="725" y="128" text-anchor="end" font-size="13" fill="#59636e">App.jsx</text>
  <line x1="380" y1="150" x2="380" y2="168" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="20" y="172" width="720" height="52" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="40" y="204" font-size="15" fill="#1a1a1a"><tspan font-weight="700">3</tspan>  <tspan font-family="ui-monospace, Consolas, monospace">useParams()</tspan> gives <tspan font-family="ui-monospace, Consolas, monospace">{ ticketId: '2' }</tspan>, a string</text>
  <text x="725" y="204" text-anchor="end" font-size="13" fill="#59636e">TicketDetailPage.jsx</text>
  <line x1="380" y1="226" x2="380" y2="244" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <rect x="20" y="248" width="720" height="52" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="40" y="280" font-size="15" fill="#1a1a1a"><tspan font-weight="700">4</tspan>  <tspan font-family="ui-monospace, Consolas, monospace">find()</tspan> looks for <tspan font-family="ui-monospace, Consolas, monospace">id === Number('2')</tspan>: ticket 2</text>
  <text x="725" y="280" text-anchor="end" font-size="13" fill="#59636e">TicketDetailPage.jsx</text>
  <line x1="380" y1="302" x2="380" y2="320" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <rect x="20" y="324" width="720" height="52" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="40" y="356" font-size="15" fill="#1a1a1a"><tspan font-weight="700">5</tspan>  The page shows "Invoice discrepancy"</text>
  <text x="725" y="356" text-anchor="end" font-size="13" fill="#59636e">TicketDetailPage.jsx</text>
</svg>
