<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Checking the session when the app starts</title>
  <desc id="desc">When the app starts, after a reload, in a new tab, or after typing a URL, AuthProvider asks whether there's a saved token. If not, there's nothing to check: isCheckingSession is false from the start, and the routes show straight away, with nobody logged in. If there is a saved token, isCheckingSession starts as true, and App shows Checking your session… instead of the routes. AuthProvider sends GET /auth/me with the saved token. If the answer is 200, the token is valid: setUser(currentUser), and the user is logged in, still on the same page. If the answer is 401, or no answer comes, clearSavedToken(): the user is logged out, and a protected page sends them to /login. Either way, finally, setIsCheckingSession(false), and App shows the routes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="820" height="600" fill="#ffffff"/>
  <rect x="250" y="20" width="320" height="58" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="264" y="42" font-size="14" fill="#1a1a1a" font-weight="700">The app starts</text>
  <text x="264" y="62" font-size="13" fill="#3d444d">a reload, a new tab, or a typed URL</text>
  <path d="M 410 112 L 520 146 L 410 180 L 300 146 Z" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="410" y="144" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="middle">A saved token</text>
  <text x="410" y="162" font-size="13" fill="#1a1a1a" text-anchor="middle">in localStorage?</text>
  <path d="M 410 78 V 110" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 300 146 H 140 V 214" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="138" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">No</text>
  <rect x="20" y="216" width="240" height="106" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="238" font-size="14" fill="#1a1a1a" font-weight="700">Nothing to check</text>
  <text x="34" y="258" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">isCheckingSession: false</tspan></text>
  <text x="34" y="278" font-size="13" fill="#3d444d">the routes show straight away,</text>
  <text x="34" y="298" font-size="13" fill="#3d444d">with nobody logged in</text>
  <path d="M 520 146 H 640 V 214" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="138" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">Yes</text>
  <rect x="470" y="216" width="330" height="66" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="484" y="238" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">isCheckingSession: true</tspan></text>
  <text x="484" y="258" font-size="13" fill="#3d444d">App shows &quot;Checking your session…&quot;</text>
  <path d="M 640 282 V 310" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="312" width="330" height="58" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="484" y="334" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">GET /auth/me</tspan></text>
  <text x="484" y="354" font-size="13" fill="#3d444d">with the saved token</text>
  <path d="M 600 370 V 386 H 425 V 412" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="436" y="404" font-size="13" fill="#1a1a1a" font-weight="700">200</text>
  <path d="M 680 370 V 412" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="672" y="404" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="end">401, or no answer</text>
  <rect x="300" y="414" width="250" height="88" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="314" y="436" font-size="14" fill="#1a1a1a" font-weight="700">The token is good</text>
  <text x="314" y="456" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">setUser(currentUser)</tspan></text>
  <text x="314" y="476" font-size="13" fill="#3d444d">logged in, on the same page</text>
  <rect x="570" y="414" width="230" height="88" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="584" y="436" font-size="14" fill="#1a1a1a" font-weight="700">The token is no good</text>
  <text x="584" y="456" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">clearSavedToken()</tspan></text>
  <text x="584" y="476" font-size="13" fill="#3d444d">logged out</text>
  <path d="M 425 502 V 530" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 685 502 V 530" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="532" width="500" height="54" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="314" y="554" font-size="14" fill="#1a1a1a" font-weight="700">finally </text>
  <text x="314" y="574" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">setIsCheckingSession(false)</tspan>: App shows the routes</text>
</svg>
