<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 556" width="820" height="556" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">When the session ends</title>
  <desc id="desc">Seven steps, from a request to the login page. 1, page: any page loads, for example TicketDetailPage calls getTicket(ticketId) in its effect. 2, HTTP: GET /tickets/1 goes out with the saved token, which is a day old, in the Authorization header. 3, the API: authenticate.js answers 401, Invalid or expired token. 4, client.js: the status is 401, a token was sent, and a sessionExpiredHandler is set, so it calls sessionExpiredHandler(), then throws the error as usual. 5, AuthProvider: the handler it registered calls clearSavedToken() and setUser(null). 6, re-render: ProtectedRoute finds no user, and renders Navigate to /login with replace. 7, result: the login page. The user is logged out from one place, whichever page was open.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="820" height="556" fill="#ffffff"/>
  <text x="20" y="53" font-size="13" fill="#116329" font-weight="700">PAGE</text>
  <rect x="160" y="20" width="640" height="56" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="174" y="42" font-size="14" fill="#1a1a1a" font-weight="700">Any page loads, e.g. <tspan font-family="ui-monospace, Consolas, monospace">TicketDetailPage</tspan></text>
  <text x="174" y="62" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">getTicket(ticketId)</tspan> in its effect</text>
  <text x="20" y="129" font-size="13" fill="#7d4e00" font-weight="700">HTTP</text>
  <rect x="160" y="96" width="640" height="56" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="174" y="118" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">GET /tickets/1</tspan> goes out with the saved token</text>
  <text x="174" y="138" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">Authorization: Bearer eyJhbGci…</tspan>  (a day old)</text>
  <path d="M 200 76 V 94" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="205" font-size="13" fill="#59636e" font-weight="700">THE API</text>
  <rect x="160" y="172" width="640" height="56" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="174" y="194" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">authenticate.js</tspan> answers <tspan font-family="ui-monospace, Consolas, monospace">401</tspan></text>
  <text x="174" y="214" font-size="13" fill="#3d444d">&quot;Invalid or expired token&quot;</text>
  <path d="M 200 152 V 170" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="281" font-size="13" fill="#7d4e00" font-weight="700">CLIENT.JS</text>
  <rect x="160" y="248" width="640" height="56" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="174" y="270" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">status === 401 &amp;&amp; token &amp;&amp; sessionExpiredHandler</tspan></text>
  <text x="174" y="290" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">sessionExpiredHandler()</tspan>, then throw the error as usual</text>
  <path d="M 200 228 V 246" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="357" font-size="13" fill="#116329" font-weight="700">AUTHPROVIDER</text>
  <rect x="160" y="324" width="640" height="56" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="174" y="346" font-size="14" fill="#1a1a1a" font-weight="700">The handler it registered</text>
  <text x="174" y="366" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">clearSavedToken()</tspan> and <tspan font-family="ui-monospace, Consolas, monospace">setUser(null)</tspan></text>
  <path d="M 200 304 V 322" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="433" font-size="13" fill="#116329" font-weight="700">RE-RENDER</text>
  <rect x="160" y="400" width="640" height="56" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="174" y="422" font-size="14" fill="#1a1a1a" font-weight="700"><tspan font-family="ui-monospace, Consolas, monospace">ProtectedRoute</tspan> finds no user</text>
  <text x="174" y="442" font-size="13" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">&lt;Navigate to=&quot;/login&quot; replace /></tspan></text>
  <path d="M 200 380 V 398" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="509" font-size="13" fill="#0550ae" font-weight="700">RESULT</text>
  <rect x="160" y="476" width="640" height="56" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="174" y="498" font-size="14" fill="#1a1a1a" font-weight="700">The login page</text>
  <text x="174" y="518" font-size="13" fill="#3d444d">logged out, from one place, whichever page was open</text>
  <path d="M 200 456 V 474" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
