<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two stages, one small image</title>
  <desc id="desc">Stage 1, build, from node:22-alpine: the package files, npm ci makes node_modules, the source is copied in, then npm run build makes dist. Only dist crosses to stage 2, by COPY --from=build. Stage 2, from nginx:1.30-alpine: nginx.conf and dist in /usr/share/nginx/html. Stage 1 is left out of the image. Stage 2 is the image that runs, about 93 MB, the size of nginx itself; the API's image is 775 MB.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>

  <!-- stage 1 -->
  <rect x="20" y="20" width="320" height="300" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="46" font-size="15" font-weight="700" fill="#1a1a1a">Stage 1: build</text>
  <text x="34" y="66" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">FROM node:22-alpine AS build</text>

  <rect x="34" y="82" width="292" height="36" rx="6" fill="#ffffff" stroke="#59636e"/>
  <text x="46" y="105" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">package.json, package-lock.json</text>
  <rect x="34" y="128" width="292" height="36" rx="6" fill="#ffffff" stroke="#59636e"/>
  <text x="46" y="151" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">npm ci</tspan> → node_modules</text>
  <rect x="34" y="174" width="292" height="36" rx="6" fill="#dafbe1" stroke="#116329"/>
  <text x="46" y="197" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">COPY . .</tspan> → src, index.html, …</text>
  <rect x="34" y="220" width="292" height="36" rx="6" fill="#ddf4ff" stroke="#0550ae"/>
  <text x="46" y="243" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">ARG VITE_API_URL</tspan>, then <tspan font-family="ui-monospace, Consolas, monospace">npm run build</tspan></text>
  <rect x="34" y="266" width="292" height="40" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="46" y="291" font-size="13" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">/app/dist</text>

  <!-- arrow -->
  <line x1="328" y1="286" x2="476" y2="286" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404" y="276" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">COPY --from=build</text>
  <text x="404" y="306" font-size="11" fill="#3d444d" text-anchor="middle">only dist/</text>

  <!-- stage 2 -->
  <rect x="480" y="120" width="360" height="200" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="494" y="146" font-size="15" font-weight="700" fill="#1a1a1a">Stage 2: serve</text>
  <text x="494" y="166" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">FROM nginx:1.30-alpine</text>
  <rect x="494" y="182" width="332" height="36" rx="6" fill="#ffffff" stroke="#59636e"/>
  <text x="506" y="205" font-size="12" fill="#1a1a1a"><tspan font-family="ui-monospace, Consolas, monospace">nginx.conf</tspan> → our site's rules</text>
  <rect x="494" y="228" width="332" height="78" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="506" y="252" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">/usr/share/nginx/html</text>
  <text x="506" y="274" font-size="12" fill="#3d444d">index.html, favicon.svg,</text>
  <text x="506" y="292" font-size="12" fill="#3d444d">assets/index-….js, index-….css</text>

  <!-- captions -->
  <text x="34" y="346" font-size="13" font-weight="700" fill="#1a1a1a">Left out of the final image</text>
  <text x="34" y="366" font-size="12" fill="#3d444d">Node, node_modules, the source code and</text>
  <text x="34" y="384" font-size="12" fill="#3d444d">package files never reach the image you run.</text>

  <text x="494" y="346" font-size="13" font-weight="700" fill="#1a1a1a">The image that runs: 93 MB</text>
  <text x="494" y="366" font-size="12" fill="#3d444d">about the size of nginx's own image.</text>
  <text x="494" y="384" font-size="12" fill="#3d444d">The API's image (Lesson 6) is 775 MB.</text>
</svg>
