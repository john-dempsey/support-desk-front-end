<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">One piece of state picks the row being renamed</title>
  <desc id="desc">On the left, the page's state: editingTagId is 1. On the right, the list of tags, one row per tag, each asking whether tag.id === editingTagId. For billing, whose id is 2, the answer is no, so the row shows the name, a Rename button and a Delete button. For bug, whose id is 1, the answer is yes, so the row shows a TagForm instead: an input holding bug, labelled New name for bug, with Save and Cancel buttons. Clicking Rename on a row sets editingTagId to that tag's id; Cancel or a successful save sets it back to null, and every row shows its name again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="20" y="100" width="170" height="80" rx="8" fill="#dafbe1" stroke="#116329" stroke-width="2"/>
  <text x="36" y="128" font-size="13" fill="#59636e">TagsPage state</text>
  <text x="36" y="158" font-size="16" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">editingTagId: 1</text>
  <text x="250" y="40" font-size="13" fill="#59636e">billing's id is 2. <tspan font-family="ui-monospace, Consolas, monospace">2 === 1</tspan>? No: its name and buttons</text>
  <rect x="250" y="50" width="490" height="60" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="266" y="86" font-size="16" font-weight="700" fill="#1a1a1a">billing</text>
  <rect x="520" y="65" width="90" height="30" rx="5" fill="#ffffff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="565.0" y="85" text-anchor="middle" font-size="13" fill="#0550ae">Rename</text>
  <rect x="620" y="65" width="100" height="30" rx="5" fill="#82071e" stroke="#82071e" stroke-width="1.5"/>
  <text x="670.0" y="85" text-anchor="middle" font-size="13" fill="#ffffff">Delete</text>
  <text x="250" y="150" font-size="13" fill="#59636e">bug's id is 1. <tspan font-family="ui-monospace, Consolas, monospace">1 === 1</tspan>? Yes: a TagForm instead</text>
  <rect x="250" y="160" width="490" height="120" rx="6" fill="#ffffff" stroke="#116329" stroke-width="2"/>
  <text x="266" y="186" font-size="13" font-weight="700" fill="#1a1a1a">New name for "bug"</text>
  <rect x="266" y="196" width="300" height="32" rx="5" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
  <text x="276" y="217" font-size="14" fill="#1a1a1a">bug</text>
  <rect x="266" y="240" width="70" height="30" rx="5" fill="#0550ae" stroke="#0550ae" stroke-width="1.5"/>
  <text x="301.0" y="260" text-anchor="middle" font-size="13" fill="#ffffff">Save</text>
  <rect x="346" y="240" width="80" height="30" rx="5" fill="#ffffff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="386.0" y="260" text-anchor="middle" font-size="13" fill="#0550ae">Cancel</text>
  <line x1="192" y1="125" x2="246" y2="82" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="192" y1="160" x2="246" y2="210" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="20" y="312" font-size="13" fill="#59636e">Rename sets <tspan font-family="ui-monospace, Consolas, monospace">editingTagId</tspan> to that tag's id. Cancel, or a successful save, sets it back to <tspan font-family="ui-monospace, Consolas, monospace">null</tspan>.</text>
</svg>
