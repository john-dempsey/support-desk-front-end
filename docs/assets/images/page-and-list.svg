<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">NotificationsPage and NotificationList</title>
  <desc id="desc">NotificationsPage, a page, at the top, holds the notifications state and the handleMarkRead function, and is the only one that calls the API. Two props go down into NotificationList, a component: notifications, the list to show, and onMarkRead, the function to call. Inside NotificationList, one list item per notification shows a New label only if it's unread, the message, the date from formatDate(createdAt), a View ticket link only if ticketId isn't null, and a Mark as read button only if it's unread. An arrow goes back up from the Mark as read button to the page, labelled onMarkRead(notification).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="392" fill="#ffffff"/>
  <rect x="20" y="20" width="720" height="84" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="46" font-size="15" font-weight="700" fill="#1a1a1a">NotificationsPage <tspan font-weight="400" fill="#3d444d">(a page)</tspan></text>
  <text x="34" y="70" font-size="13" fill="#1a1a1a">holds <tspan font-family="ui-monospace, Consolas, monospace">notifications</tspan> (state) and <tspan font-family="ui-monospace, Consolas, monospace">handleMarkRead()</tspan></text>
  <text x="34" y="90" font-size="13" fill="#3d444d">the only one of the two that calls the API</text>
  <line x1="120" y1="104" x2="120" y2="164" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="132" y="132" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">notifications</text>
  <text x="132" y="150" font-size="12" fill="#3d444d">the list to show</text>
  <line x1="320" y1="104" x2="320" y2="164" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="132" font-size="13" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">onMarkRead</text>
  <text x="332" y="150" font-size="12" fill="#3d444d">the function to call</text>
  <rect x="20" y="166" width="720" height="208" rx="6" fill="#ffffff" stroke="#116329" stroke-width="1.5"/>
  <text x="34" y="192" font-size="15" font-weight="700" fill="#1a1a1a">NotificationList <tspan font-weight="400" fill="#3d444d">(a component): one &lt;li&gt; per notification</tspan></text>
  <rect x="44" y="208" width="466" height="148" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <rect x="44" y="208" width="5" height="148" fill="#0550ae"/>
  <rect x="62" y="226" width="44" height="24" rx="5" fill="#0550ae"/>
  <text x="84" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">New</text>
  <text x="114" y="243" font-size="13" fill="#1a1a1a">Casey Customer commented on "Cannot log in".</text>
  <text x="62" y="274" font-size="13" fill="#59636e">20 Oct 2026, 08:25</text>
  <text x="62" y="322" font-size="14" fill="#0550ae" text-decoration="underline">View ticket</text>
  <rect x="170" y="300" width="120" height="34" rx="6" fill="#ffffff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="230" y="322" text-anchor="middle" font-size="14" fill="#0550ae">Mark as read</text>
  <text x="546" y="243" font-size="12" fill="#3d444d">New: only if unread</text>
  <text x="546" y="274" font-size="12" fill="#3d444d" font-family="ui-monospace, Consolas, monospace">formatDate(createdAt)</text>
  <text x="546" y="314" font-size="12" fill="#3d444d">View ticket: only if</text>
  <text x="546" y="330" font-size="12" fill="#3d444d"><tspan font-family="ui-monospace, Consolas, monospace">ticketId</tspan> isn't null</text>
  <text x="546" y="350" font-size="12" fill="#3d444d">Mark as read: only if unread</text>
  <path d="M 290 317 H 520 V 108" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="132" font-size="12" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">onMarkRead(notification)</text>
  <text x="530" y="150" font-size="12" fill="#3d444d">"this one was clicked"</text>
</svg>
