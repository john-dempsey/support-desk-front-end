<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two requests: one after the other, or both at once</title>
  <desc id="desc">Two timelines for the edit page's two requests. One after the other: getTicket runs, and only when it has finished does getAgents start, so the page waits for the two added together before it can show the form. With Promise.all(): getTicket and getAgents start at the same moment and run side by side, so the page waits only as long as the slower of the two. The second way shows the form sooner.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="20" y="44" font-size="15" font-weight="700" fill="#1a1a1a">One after the other</text>
  <text x="20" y="64" font-size="13" fill="#59636e">two awaits, one per line</text>
  <rect x="200" y="40" width="220" height="30" rx="5" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="210" y="60" font-size="14" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">getTicket()</text>
  <rect x="420" y="80" width="200" height="30" rx="5" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="430" y="100" font-size="14" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">getAgents()</text>
  <line x1="620" y1="30" x2="620" y2="120" stroke="#116329" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="626" y="42" font-size="13" font-weight="700" fill="#116329">form shows</text>
  <text x="20" y="174" font-size="15" font-weight="700" fill="#1a1a1a">Promise.all()</text>
  <text x="20" y="194" font-size="13" fill="#59636e">one await, for both</text>
  <rect x="200" y="170" width="220" height="30" rx="5" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="210" y="190" font-size="14" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">getTicket()</text>
  <rect x="200" y="210" width="200" height="30" rx="5" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5"/>
  <text x="210" y="230" font-size="14" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">getAgents()</text>
  <line x1="420" y1="160" x2="420" y2="250" stroke="#116329" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="426" y="172" font-size="13" font-weight="700" fill="#116329">form shows</text>
  <line x1="426" y1="232" x2="614" y2="232" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="224" text-anchor="middle" font-size="13" fill="#59636e">time saved</text>
  <line x1="200" y1="285" x2="720" y2="285" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="306" font-size="13" fill="#59636e">the page opens</text>
  <text x="720" y="306" text-anchor="end" font-size="13" fill="#59636e">time</text>
</svg>
