<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Who sees the notice</title>
  <desc id="desc">A grid. Rows are four changes to ticket 1, which is Casey's and assigned to Alex. Columns are who has ticket 1's page open: Casey, Alex and Ada. Casey comments: Alex sees the notice; Casey doesn't, because the author isn't told, and their own page already shows the comment; Ada doesn't, because admins aren't told about comments. Alex comments: Casey sees the notice; Alex and Ada don't. Alex changes the status: Casey sees the notice; Alex doesn't, because only the customer is told, and Alex's own save shows the change; Ada doesn't. Ada changes the status: Casey sees the notice; Alex and Ada don't. A note underneath: Ada's page never shows a notice, and neither does a page for an unassigned ticket that an agent is looking at, unless the agent is told for another reason.</desc>
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1a1a1a">Ticket 1: Casey's, assigned to Alex</text>
  <text x="20" y="60" font-size="13" fill="#3d444d">Change made</text>
  <text x="340" y="60" font-size="13" font-weight="700" fill="#1a1a1a">Casey's page</text>
  <text x="500" y="60" font-size="13" font-weight="700" fill="#1a1a1a">Alex's page</text>
  <text x="660" y="60" font-size="13" font-weight="700" fill="#1a1a1a">Ada's page</text>
  <text x="20" y="106" font-size="14" fill="#1a1a1a">Casey comments</text>
  <rect x="330" y="72" width="150" height="56" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/><text x="342" y="94" font-size="13" font-weight="700" fill="#59636e">no notice</text><text x="342" y="114" font-size="11" fill="#3d444d">you wrote it</text>
  <rect x="490" y="72" width="150" height="56" fill="#dafbe1" stroke="#116329" stroke-width="1"/><text x="502" y="94" font-size="13" font-weight="700" fill="#116329">✓ notice</text><text x="502" y="114" font-size="11" fill="#3d444d">assigned agent</text>
  <rect x="650" y="72" width="150" height="56" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/><text x="662" y="94" font-size="13" font-weight="700" fill="#59636e">no notice</text><text x="662" y="114" font-size="11" fill="#3d444d">admins aren't told</text>
  <text x="20" y="168" font-size="14" fill="#1a1a1a">Alex comments</text>
  <rect x="330" y="134" width="150" height="56" fill="#dafbe1" stroke="#116329" stroke-width="1"/><text x="342" y="156" font-size="13" font-weight="700" fill="#116329">✓ notice</text><text x="342" y="176" font-size="11" fill="#3d444d">the customer</text>
  <rect x="490" y="134" width="150" height="56" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/><text x="502" y="156" font-size="13" font-weight="700" fill="#59636e">no notice</text><text x="502" y="176" font-size="11" fill="#3d444d">you wrote it</text>
  <rect x="650" y="134" width="150" height="56" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/><text x="662" y="156" font-size="13" font-weight="700" fill="#59636e">no notice</text><text x="662" y="176" font-size="11" fill="#3d444d">admins aren't told</text>
  <text x="20" y="230" font-size="14" fill="#1a1a1a">Alex changes the status</text>
  <rect x="330" y="196" width="150" height="56" fill="#dafbe1" stroke="#116329" stroke-width="1"/><text x="342" y="218" font-size="13" font-weight="700" fill="#116329">✓ notice</text><text x="342" y="238" font-size="11" fill="#3d444d">the customer</text>
  <rect x="490" y="196" width="150" height="56" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/><text x="502" y="218" font-size="13" font-weight="700" fill="#59636e">no notice</text><text x="502" y="238" font-size="11" fill="#3d444d">you saved it</text>
  <rect x="650" y="196" width="150" height="56" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/><text x="662" y="218" font-size="13" font-weight="700" fill="#59636e">no notice</text><text x="662" y="238" font-size="11" fill="#3d444d">only the customer</text>
  <text x="20" y="292" font-size="14" fill="#1a1a1a">Ada changes the status</text>
  <rect x="330" y="258" width="150" height="56" fill="#dafbe1" stroke="#116329" stroke-width="1"/><text x="342" y="280" font-size="13" font-weight="700" fill="#116329">✓ notice</text><text x="342" y="300" font-size="11" fill="#3d444d">the customer</text>
  <rect x="490" y="258" width="150" height="56" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/><text x="502" y="280" font-size="13" font-weight="700" fill="#59636e">no notice</text><text x="502" y="300" font-size="11" fill="#3d444d">only the customer</text>
  <rect x="650" y="258" width="150" height="56" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/><text x="662" y="280" font-size="13" font-weight="700" fill="#59636e">no notice</text><text x="662" y="300" font-size="11" fill="#3d444d">you saved it</text>
  <text x="20" y="342" font-size="13" fill="#1a1a1a">Ada's page never shows a notice for this ticket. Nor does an agent's page for an unassigned ticket,</text>
  <text x="20" y="362" font-size="13" fill="#1a1a1a">unless they're told for another reason. A notification goes to the people it's <tspan font-weight="700">for</tspan>, not to</text>
  <text x="20" y="382" font-size="13" fill="#1a1a1a">everyone who happens to be looking.</text>
</svg>
