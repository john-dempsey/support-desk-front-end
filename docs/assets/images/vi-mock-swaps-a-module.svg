<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">How vi.mock swaps a module</title>
  <desc id="desc">HomePage.test.jsx imports HomePage.jsx, and imports getWelcome from welcome.api.js. HomePage.jsx also imports getWelcome from welcome.api.js. Because of vi.mock, both imports get a stand-in module, whose getWelcome is a vi.fn() fake that each test tells what to return. The real welcome.api.js, and client.js which it imports, are loaded once so Vitest can see what the file exports, but they're never called, so no request is sent. vi.mock runs before any import, because Vitest moves it to the top of the file.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>

  <rect x="20" y="30" width="250" height="96" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="145" y="56" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">HomePage.test.jsx</text>
  <text x="34" y="82" font-size="11" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">vi.mock('../api/welcome.api.js');</text>
  <text x="34" y="104" font-size="11" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">getWelcome.mockResolvedValue(...)</text>

  <rect x="20" y="230" width="250" height="70" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="145" y="256" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">HomePage.jsx</text>
  <text x="145" y="280" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">await getWelcome()</text>

  <line x1="145" y1="128" x2="145" y2="226" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="153" y="182" font-size="11" fill="#3d444d">imports</text>

  <rect x="340" y="120" width="230" height="110" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="2"/>
  <text x="455" y="146" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">the stand-in module</text>
  <text x="455" y="172" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">getWelcome = vi.fn()</text>
  <text x="455" y="196" font-size="11" fill="#3d444d" text-anchor="middle">returns whatever the test</text>
  <text x="455" y="212" font-size="11" fill="#3d444d" text-anchor="middle">told it to</text>

  <line x1="272" y1="90" x2="338" y2="146" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="140" font-size="11" fill="#3d444d" text-anchor="end">imports</text>
  <text x="270" y="154" font-size="11" fill="#3d444d" text-anchor="end">getWelcome</text>
  <line x1="272" y1="262" x2="338" y2="208" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="276" font-size="11" fill="#3d444d">imports getWelcome</text>

  <rect x="640" y="60" width="200" height="76" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75"/>
  <text x="740" y="88" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">welcome.api.js</text>
  <text x="740" y="110" font-size="11" fill="#3d444d" text-anchor="middle">the real one</text>

  <rect x="640" y="186" width="200" height="66" rx="6" fill="#fff8c5" stroke="#7d4e00" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75"/>
  <text x="740" y="214" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">client.js</text>
  <text x="740" y="236" font-size="11" fill="#3d444d" text-anchor="middle">fetch() is never called</text>
  <line x1="740" y1="138" x2="740" y2="182" stroke="#59636e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="638" y1="98" x2="574" y2="140" stroke="#59636e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="604" y="62" font-size="11" fill="#3d444d" text-anchor="middle">read once:</text>
  <text x="604" y="76" font-size="11" fill="#3d444d" text-anchor="middle">what does it export?</text>

  <rect x="20" y="326" width="820" height="56" rx="6" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
  <text x="34" y="348" font-size="12" fill="#1a1a1a">Every import of welcome.api.js in this test file's process gets the stand-in, the page's as well as the test's. vi.mock</text>
  <text x="34" y="368" font-size="12" fill="#1a1a1a">runs before any import, because Vitest moves it to the top of the file. The real file is never called, so no request is sent.</text>
</svg>
