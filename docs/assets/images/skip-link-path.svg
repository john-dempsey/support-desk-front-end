<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two ways from the top of the page to the first filter</title>
  <desc id="desc">The ticket list, logged in as Ada. Without the skip link, Tab goes through every stop in the header first: 1, Skip to main content; 2, Home; 3, Tickets; 4, Notifications; 5, Tags; 6, Log out; and only the 7th Tab reaches the Status filter, the first control in main. With the skip link: Tab once to reach Skip to main content, which slides into view; press Enter, which jumps to main, with the address ending in #main-content; then Tab once more, and focus is on the Status filter. Two Tabs and an Enter, on every page, however long the navigation grows.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0550ae"/>
    </marker>
  </defs>
  <rect width="860" height="420" fill="#ffffff"/>

  <!-- The page -->
  <rect x="20" y="20" width="820" height="90" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
  <text x="34" y="42" font-size="13" font-weight="700" fill="#1a1a1a">header (NavBar)</text>
  <g font-size="13" fill="#1a1a1a">
    <rect x="34" y="54" width="172" height="40" rx="4" fill="#ddf4ff" stroke="#0550ae" stroke-width="1.5"/>
    <text x="44" y="79">1 Skip to main content</text>
    <rect x="218" y="54" width="80" height="40" rx="4" fill="#ffffff" stroke="#59636e"/>
    <text x="232" y="79">2 Home</text>
    <rect x="310" y="54" width="92" height="40" rx="4" fill="#ffffff" stroke="#59636e"/>
    <text x="322" y="79">3 Tickets</text>
    <rect x="414" y="54" width="140" height="40" rx="4" fill="#ffffff" stroke="#59636e"/>
    <text x="426" y="79">4 Notifications</text>
    <rect x="566" y="54" width="76" height="40" rx="4" fill="#ffffff" stroke="#59636e"/>
    <text x="580" y="79">5 Tags</text>
    <rect x="720" y="54" width="104" height="40" rx="4" fill="#ffffff" stroke="#59636e"/>
    <text x="736" y="79">6 Log out</text>
  </g>

  <rect x="20" y="150" width="820" height="110" rx="6" fill="#dafbe1" stroke="#116329" stroke-width="1.5"/>
  <text x="230" y="172" font-size="13" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, Consolas, monospace">&lt;main id="main-content"&gt;</text>
  <text x="230" y="194" font-size="13" fill="#3d444d">the ticket list</text>
  <rect x="34" y="206" width="150" height="40" rx="4" fill="#ffffff" stroke="#116329" stroke-width="2"/>
  <text x="44" y="231" font-size="13" fill="#1a1a1a">7 Status filter</text>
  <rect x="218" y="206" width="130" height="40" rx="4" fill="#ffffff" stroke="#59636e"/>
  <text x="230" y="231" font-size="13" fill="#1a1a1a">8 Sort by</text>

  <!-- Without -->
  <text x="20" y="300" font-size="15" font-weight="700" fill="#1a1a1a">Without the skip link</text>
  <text x="20" y="324" font-size="13" fill="#3d444d">Tab through all six header stops:</text>
  <text x="20" y="344" font-size="13" fill="#3d444d">the 7th Tab reaches the first filter.</text>
  <text x="20" y="364" font-size="13" fill="#3d444d">Every page, every time, and more Tabs</text>
  <text x="20" y="384" font-size="13" fill="#3d444d">as the navigation grows.</text>

  <!-- With -->
  <text x="400" y="300" font-size="15" font-weight="700" fill="#0550ae">With it: Tab, Enter, Tab</text>
  <text x="400" y="324" font-size="13" fill="#3d444d">1. Tab: "Skip to main content" slides into view</text>
  <text x="400" y="344" font-size="13" fill="#3d444d">2. Enter: jump to main (the address gains #main-content)</text>
  <text x="400" y="364" font-size="13" fill="#3d444d">3. Tab: focus is on the Status filter</text>
  <path d="M120 96 C 120 130, 120 180, 120 204" fill="none" stroke="#0550ae" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow-blue)"/>
  <text x="130" y="140" font-size="12" font-weight="700" fill="#0550ae">Enter, then Tab</text>
</svg>
