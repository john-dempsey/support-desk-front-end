# nginx settings for the built front-end (used by the Dockerfile).
# nginx only sends files: every page is drawn by React in the browser, and
# the browser calls the API itself.

server {
    listen 80;
    root /usr/share/nginx/html;

    # Every URL that isn't a real file gets index.html. There is no
    # tickets/3 file in dist/: React Router reads the URL in the browser
    # and shows the right page. Without this line, refreshing /tickets/3
    # would get nginx's own "404 Not Found".
    location / {
        try_files $uri /index.html;
        # Ask the server every time, so a new build is picked up at once.
        add_header Cache-Control "no-cache";
    }

    # The JS and CSS from `npm run build`. A file's name has a hash in it
    # that changes whenever the build's content does, so a file with a
    # given name never changes: the browser may keep it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A missing asset is a real 404, not index.html.
        try_files $uri =404;
    }
}
